<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var SAVE_KEY='novavista.save.v2';
var BACKUP_KEY='novavista.backup.v2';
var SALT_KEY='novavista.salt.v2';
var PROFILES_KEY='novavista.profiles.v1';
var LAST_PROFILE_KEY='novavista.lastprofile.v1';
var currentProfile=null;
var profiles=null;
var store=null;
try{
store=window.localStorage;

var probe='__nv_test__';
store.setItem(probe,'1');
store.removeItem(probe);
}catch(e){store=null;}
function hasStore(){return!!store;}
function saveKeyFor(id){return'novavista.save.v2.'+id;}
function backupKeyFor(id){return'novavista.backup.v2.'+id;}
function loadProfiles(){
if(profiles)return profiles;
profiles=[];
if(!store)return profiles;
try{
var raw=store.getItem(PROFILES_KEY);
if(raw){
var arr=JSON.parse(raw);
if(Array.isArray(arr))profiles=arr.filter(function(p){return p&&p.id;});
}
}catch(e){}
return profiles;
}
function persistProfiles(){
if(!store)return;
try{store.setItem(PROFILES_KEY,JSON.stringify(profiles));}catch(e){}
}
function migrateLegacy(){

loadProfiles();
if(profiles.length||!store)return;
var legacy=null;
try{legacy=store.getItem(SAVE_KEY);}catch(e){}
if(!legacy)return;
var name='Usuario';
try{
var box=JSON.parse(legacy);
var st=JSON.parse(box.d);
if(st&&st.profile&&st.profile.name)name=st.profile.name;
}catch(e){}
var p={id:'default',name:name,avatar:0,createdAt:Date.now(),lastSeen:Date.now(),level:1};
profiles.push(p);

try{
store.setItem(saveKeyFor(p.id),legacy);
store.removeItem(SAVE_KEY);
}catch(e){}
persistProfiles();
}
function listProfiles(){
migrateLegacy();
loadProfiles();
return profiles.map(function(p){return{id:p.id,name:p.name,avatar:p.avatar,level:p.level||1,lastSeen:p.lastSeen||0};});
}
function createProfile(name,avatar){
migrateLegacy();
loadProfiles();
var p={
id:'p'+Util.cyrb53(String(Date.now())+Math.random(),3).toString(36),
name:String(name||'Usuario').trim().slice(0,20)||'Usuario',
avatar:avatar||0,
createdAt:Date.now(),lastSeen:Date.now(),level:1
};
profiles.push(p);
persistProfiles();
return p;
}
function deleteProfile(id){
if(currentProfile&&currentProfile.id===id)return false;
loadProfiles();
profiles=profiles.filter(function(p){return p.id!==id;});
persistProfiles();
try{
store.removeItem(saveKeyFor(id));
store.removeItem(backupKeyFor(id));
}catch(e){}
if(currentProfile&&currentProfile.id===id)currentProfile=null;
return true;
}
function setProfile(id){
loadProfiles();
currentProfile=null;
for(var i=0;i<profiles.length;i++){
if(profiles[i].id===id)currentProfile=profiles[i];
}
if(currentProfile&&store){
try{store.setItem(LAST_PROFILE_KEY,id);}catch(e){}
}
return!!currentProfile;
}
function currentProfileId(){return currentProfile?currentProfile.id:null;}
function lastProfileId(){
if(!store)return null;
try{return store.getItem(LAST_PROFILE_KEY);}catch(e){return null;}
}
function touchProfile(state){
if(!currentProfile)return;
currentProfile.name=state.profile.name;
currentProfile.avatar=state.profile.avatar;
currentProfile.level=state.currencies.level;
currentProfile.lastSeen=Date.now();
persistProfiles();
}
function getSalt(){
if(!store)return'sin-storage';
var s=null;
try{s=store.getItem(SALT_KEY);}catch(e){}
if(!s){
var entropy=String(Date.now())+'|'+String(Math.random())+
(typeof navigator!=='undefined'?navigator.userAgent:'nv')+'|'+String(Math.random());
s=Util.hashStr(entropy)+Util.cyrb53(entropy,0x5eed).toString(36);
try{store.setItem(SALT_KEY,s);}catch(e){}
}
return s;
}
function sign(payload){

var a=Util.hashStr(payload+'::'+getSalt());
var b=Util.hashStr(payload.split('').reverse().join('')+'::'+getSalt());
return a+b;
}
function verify(payload,sig){
var a=Util.hashStr(payload+'::'+getSalt());
var b=Util.hashStr(payload.split('').reverse().join('')+'::'+getSalt());
var expect=a+b;
if(expect.length!==sig.length)return false;

var diff=0;
for(var i=0;i<expect.length;i++)diff|=expect.charCodeAt(i)^sig.charCodeAt(i);
return diff===0;
}
function structuralCheck(o){
if(!o||typeof o!=='object')return false;
var need=['meta','profile','settings','currencies','bank','social','bots','broker','data','upg','inventory','av','quests','events','stats'];
for(var i=0;i<need.length;i++)if(!o[need[i]])return false;
if(!o.meta.installId)return false;
var c=o.currencies;
if(!isFinite(c.cash)||!isFinite(c.novaCoins)||!isFinite(c.xp)||!isFinite(c.energy)||!isFinite(c.maxEnergy))return false;
if(c.cash<0||c.novaCoins<0||c.xp<0||c.energy<0||c.maxEnergy<1)return false;
if(!isFinite(o.bank.balance)||o.bank.balance<0)return false;
if(!isFinite(o.data.mb)||o.data.mb<0)return false;
if(typeof o.upg!=='object'||typeof o.inventory.tools!=='object')return false;
return true;
}
function save(state){
if(!hasStore())return false;
try{
var payload=JSON.stringify(state);
var full=JSON.stringify({d:payload,h:sign(payload)});
var key=currentProfile?saveKeyFor(currentProfile.id):SAVE_KEY;
var bk=currentProfile?backupKeyFor(currentProfile.id):BACKUP_KEY;

var prev=store.getItem(key);
if(prev)store.setItem(bk,prev);
store.setItem(key,full);
touchProfile(state);
return true;
}catch(e){return false;}
}
function load(){
if(!hasStore())return{ok:false,error:'Sin almacenamiento disponible.'};
var key=currentProfile?saveKeyFor(currentProfile.id):SAVE_KEY;
var raw=null;
try{raw=store.getItem(key);}catch(e){}
if(!raw)return{ok:false,error:'Sin partida guardada.'};
try{
var box=JSON.parse(raw);
if(!box||typeof box.d!=='string'||typeof box.h!=='string'){
return{ok:false,tampered:true,error:'Guardado malformado.'};
}
if(!verify(box.d,box.h)){
return{ok:false,tampered:true,error:'La firma de integridad no coincide (guardado editado o corrupto).'};
}
var state=JSON.parse(box.d);
if(!structuralCheck(state)){
return{ok:false,tampered:true,error:'El estado no pasa la validación estructural.'};
}
return{ok:true,state:state};
}catch(e){
return{ok:false,tampered:true,error:'Guardado ilegible.'};
}
}
function loadBackup(){
if(!hasStore())return null;
try{
var key=currentProfile?backupKeyFor(currentProfile.id):BACKUP_KEY;
var raw=store.getItem(key);
if(!raw)return null;
var box=JSON.parse(raw);
if(!box||!verify(box.d,box.h))return null;
var state=JSON.parse(box.d);
return structuralCheck(state)?state:null;
}catch(e){return null;}
}
function wipe(){
if(!hasStore())return;
try{
if(currentProfile){
store.removeItem(saveKeyFor(currentProfile.id));
store.removeItem(backupKeyFor(currentProfile.id));
}else{
store.removeItem(SAVE_KEY);
store.removeItem(BACKUP_KEY);
}
}catch(e){}
}
function exportSave(state){
var payload=JSON.stringify(state);
var full=JSON.stringify({d:payload,h:sign(payload)});
try{
return btoa(unescape(encodeURIComponent(full)));
}catch(e){return null;}
}
function importSave(text){
if(!text||typeof text!=='string')return{ok:false,error:'Texto vacío.'};
try{
var full=decodeURIComponent(escape(atob(text.replace(/\s+/g,''))));
var box=JSON.parse(full);
if(!box||typeof box.d!=='string'||typeof box.h!=='string'){
return{ok:false,error:'Código de importación malformado.'};
}
if(!verify(box.d,box.h)){
return{ok:false,error:'La firma de integridad no es válida para esta instalación.'};
}
var state=JSON.parse(box.d);
if(!structuralCheck(state))return{ok:false,error:'Estado no válido.'};
return{ok:true,state:state};
}catch(e){
return{ok:false,error:'No se pudo interpretar el código.'};
}
}
NS.Save={
hasStore:hasStore,
save:save,
load:load,
loadBackup:loadBackup,
wipe:wipe,
exportSave:exportSave,
importSave:importSave,
sign:sign,
listProfiles:listProfiles,
createProfile:createProfile,
deleteProfile:deleteProfile,
setProfile:setProfile,
currentProfileId:currentProfileId,
lastProfileId:lastProfileId,
migrateLegacy:migrateLegacy
};
})();
</script>
<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var Sec=NS.Sec;
var Cat=NS.Catalog;
var S=null;
var lastTick=0;
var hooks=[];
var offlineApplied=false;
var prevTot=null;
function fresh(){
return{
meta:{
version:2,
installId:Util.hashStr(String(Date.now())+Math.random()),
createdAt:Date.now(),lastSeen:Date.now(),bootCount:0,totalPlayMs:0,
runsDone:0,runsTraced:0,nodesDrained:0,bossesDrained:0,
allTimeCoins:0,legacy:0,formatsDone:0,threatsStopped:0
},
profile:{name:'Usuario',avatar:0},
settings:{theme:'luna',wallpaper:'bliss',sound:true,notifs:true},
currencies:{cash:50,novaCoins:0,xp:0,level:1,energy:12,maxEnergy:12,legacy:0},
bank:{balance:50,loanDebt:0,totalInterest:0,price:12},
social:{followers:0,lastPostAt:0,totalPosts:0,viralBest:0},
bots:{count:0},
broker:{priceLvl:0,dataSold:0},
data:{mb:0,maxMB:2000},
upg:{},
inventory:{tools:{}},
av:{level:0,firewall:0,malwareStopped:0,lastScanAt:0},
run:null,
quests:{},
events:{nextMalwareAt:0,nextAdAt:0},
browser:{impressions:0,auto:0,clicks:0},
games:{pinball:0,pinballCash:0,pool:0,poolWins:0},
docs:[],
stats:{clicks:0,posts:0,hacks:0,traces:0,offlineSessions:0}
};
}
function emit(type,payload){
hooks.forEach(function(h){try{h(type,payload);}catch(e){}});
}
function on(hook){hooks.push(hook);}
function upg(id){return S.upg[id]||0;}
function incomeMult(){
var m=1;
m*=1+0.02*S.currencies.level;
m*=1+0.03*S.currencies.legacy;
m*=1+0.05*upg('i-income');
return m;
}
function bankRate(){

var r=0.0003+0.0004*upg('b-rate')+0.0002*upg('b-off');
r*=1+0.35*upg('b-cd');
return r*incomeMult();
}
function socialAdRate(){return 0.003*(1+0.5*upg('s-ad'))*incomeMult();}
function followerGrowthRate(){return 0.0012*upg('s-vrf')*incomeMult();}
function botCoinRate(){return S.bots.count*0.0015*(1+0.4*upg('b-rig'))*incomeMult();}
function energyRegen(){return 0.125*Math.pow(1.5,upg('e-regen'));}
function maxEnergy(){return 12+upg('e-max')+upg('i-energy');}
function dataPrice(){return 8*(1+0.5*upg('d-price'))*incomeMult();}
function dataMaxMB(){return 2000+500*upg('d-cap');}
function botCount(){return upg('b-count');}
function xpForLevel(l){return Math.floor(40*Math.pow(l,1.5));}
function legacyForCoins(c){return Math.floor(10*Math.sqrt(Math.max(0,c)));}
function addCash(n){
n=Sec.guardNum(n,'addCash');
if(n===0)return;
S.currencies.cash+=n;
if(S.currencies.cash<0){Sec.quarantine('Saldo negativo inválido');S.currencies.cash=0;}
}
function spendCash(n){
n=Sec.guardNum(n,'spendCash');
if(n<0||S.currencies.cash<n)return false;
S.currencies.cash-=n;
return true;
}
function addCoins(n){
n=Sec.guardNum(n,'addCoins');
if(n<=0)return;
S.currencies.novaCoins+=n;
S.meta.allTimeCoins+=n;
}
function spendCoins(n){
n=Sec.guardNum(n,'spendCoins');
if(n<0||S.currencies.novaCoins<n)return false;
S.currencies.novaCoins-=n;
return true;
}
function addXP(n){
n=Sec.guardNum(n,'addXP');
if(n<=0)return;
S.currencies.xp+=n;
while(S.currencies.xp>=xpForLevel(S.currencies.level+1)){
S.currencies.level++;
emit('levelup',{level:S.currencies.level});
}
}
function addEnergy(n){
n=Sec.guardNum(n,'addEnergy');
if(n<=0)return;
S.currencies.energy=Math.min(maxEnergy(),S.currencies.energy+n);
}
function spendEnergy(n){
n=Sec.guardNum(n,'spendEnergy');
if(n<0||S.currencies.energy<n)return false;
S.currencies.energy-=n;
return true;
}
function addFollowers(n){
n=Sec.guardNum(n,'addFollowers');
if(n<=0)return;
S.social.followers+=n;
}
function addDataMB(n){
n=Sec.guardNum(n,'addDataMB');
if(n<=0)return;
var free=S.data.maxMB-S.data.mb;
var added=Math.min(n,free);
S.data.mb+=added;
if(added<n)emit('dataOverflow',{lost:n-added});
return added;
}
function sellDataMB(n){
n=Sec.guardNum(n,'sellDataMB');
if(n<=0)return 0;
var real=Math.min(n,S.data.mb);
if(real<=0)return 0;
S.data.mb-=real;
addCash(real*dataPrice());
S.broker.dataSold+=real;
return real;
}
function buyUpgrade(id){
var def=Cat.UPGRADES[id];
if(!def)return{ok:false,why:'inexistente'};
var lvl=upg(id);
if(lvl>=def.max)return{ok:false,why:'max'};
var cost=Cat.upgradeCost(def,lvl);
if(!spendCash(cost))return{ok:false,why:'dinero'};
S.upg[id]=lvl+1;
emit('upgrade',{id:id,lvl:S.upg[id]});
return{ok:true};
}
function buyImplant(id){
var def=Cat.IMPLANTS[id];
if(!def)return{ok:false,why:'inexistente'};
var lvl=upg(id);
if(lvl>=def.max)return{ok:false,why:'max'};
var cost=Cat.implantCost(def,lvl);
if(!spendCoins(cost))return{ok:false,why:'coins'};
S.upg[id]=lvl+1;
emit('upgrade',{id:id,lvl:S.upg[id]});
return{ok:true};
}
function buyTool(id,qty){
var def=Cat.TOOLS[id];
if(!def)return{ok:false,why:'inexistente'};
qty=Sec.guardNum(qty||1,'buyTool')||1;
qty=Math.max(1,Math.min(99,Math.floor(qty)));
var cost=def.price*qty;
if(!spendCash(cost))return{ok:false,why:'dinero'};
S.inventory.tools[id]=(S.inventory.tools[id]||0)+qty;
emit('tool',{id:id,qty:S.inventory.tools[id]});
return{ok:true};
}
function useTool(id){
if((S.inventory.tools[id]||0)<=0)return false;
S.inventory.tools[id]--;
return true;
}
function loanTake(amount){
amount=Sec.guardNum(amount,'loanTake');
if(amount<100)return{ok:false};
S.bank.loanDebt+=amount;
addCash(amount);
emit('loan',{debt:S.bank.loanDebt});
return{ok:true};
}
function loanRepay(){
var debt=S.bank.loanDebt;
if(debt<=0)return{ok:false};
if(S.currencies.cash<debt)return{ok:false,why:'dinero'};
spendCash(debt);
S.bank.loanDebt=0;
return{ok:true};
}
function deposit(n){
n=Sec.guardNum(n,'deposit');
if(n<=0)return{ok:false,why:'cantidad'};
if(n>S.currencies.cash)n=S.currencies.cash;
if(n<=0)return{ok:false,why:'dinero'};
spendCash(n);
S.bank.balance+=n;
return{ok:true,amount:n};
}
function withdraw(n){
n=Sec.guardNum(n,'withdraw');
if(n<=0)return{ok:false,why:'cantidad'};
if(n>S.bank.balance)n=S.bank.balance;
if(n<=0)return{ok:false,why:'saldo'};
S.bank.balance-=n;
addCash(n);
return{ok:true,amount:n};
}
function stepCoinPrice(dtMs){

var p=S.bank.price;
var drift=(Math.random()-0.5)*0.6*(dtMs/60000);
p+=drift;
if(Math.random()<0.03*(dtMs/60000))p+=(Math.random()-0.5)*8;
S.bank.price=Math.round(Util.clamp(p,6,60)*100)/100;
}
function buyCoins(amount){
var cost=amount*S.bank.price;
if(!spendCash(cost))return{ok:false,why:'dinero'};
addCoins(amount);
return{ok:true};
}
function sellCoins(amount){
var rate=S.bank.price*0.85;
amount=Math.min(amount,S.currencies.novaCoins);
if(amount<=0)return{ok:false,why:'coins'};
addCash(amount*rate);
S.currencies.novaCoins-=amount;
return{ok:true};
}
function makePost(){
var base=6*(1+0.4*upg('s-post'));
var viral=0.5+Math.random()*1.2;
var burst=Math.floor(base*viral*(1+upg('s-vrf')*0.12));
addFollowers(burst);
S.social.totalPosts++;
S.social.lastPostAt=Sec.now();
S.social.viralBest=Math.max(S.social.viralBest,viral);
S.stats.posts++;
emit('post',{gained:burst,viral:viral});
return burst;
}
function tick(dtMs){
dtMs=Sec.validateDelta(dtMs);
if(dtMs<=0)return;
var dt=dtMs/1000;

S.data.maxMB=dataMaxMB();
S.bots.count=botCount();
S.currencies.maxEnergy=maxEnergy();

if(!Sec.isQuarantined()){

var interest=S.bank.balance*bankRate()*dt;
if(interest>0){S.bank.balance+=interest;S.bank.totalInterest+=interest;}

var adRev=S.social.followers*socialAdRate()*dt;
if(adRev>0)addCash(adRev);
var growth=S.social.followers*followerGrowthRate()*dt;
if(growth>0)S.social.followers+=growth;

var coins=botCoinRate()*dt;
if(coins>0)addCoins(coins);
}

S.currencies.energy=Math.min(maxEnergy(),S.currencies.energy+energyRegen()*dt);

if(S.bank.loanDebt>0)S.bank.loanDebt+=S.bank.loanDebt*0.00005*dt;

stepCoinPrice(dtMs);

var now=Sec.now();
if(!S.events.nextMalwareAt)S.events.nextMalwareAt=now+90000;
if(now>=S.events.nextMalwareAt){
S.events.nextMalwareAt=now+(150000+Math.random()*200000);
emit('malware');
}
if(!S.events.nextAdAt)S.events.nextAdAt=now+60000;
if(now>=S.events.nextAdAt){
S.events.nextAdAt=now+(60000+Math.random()*90000);
emit('ad');
}
S.meta.totalPlayMs+=dtMs;
S.meta.lastSeen=now;
lastTick=now;
}
function offline(deltaMs){
if(offlineApplied)return 0;
offlineApplied=true;
if(Sec.isQuarantined())return 0;
deltaMs=Sec.guardNum(deltaMs,'offline');
var cap=8*3600*1000;
var real=Math.min(Math.max(0,deltaMs),cap);
if(real<60000)return 0;
var dt=real/1000*0.5;
var gained={cash:0,coins:0,followers:0,interest:0};
gained.interest=S.bank.balance*bankRate()*dt;
S.bank.balance+=gained.interest;
gained.cash=S.social.followers*socialAdRate()*dt;
addCash(gained.cash);
var g=S.social.followers*followerGrowthRate()*dt;
S.social.followers+=g;gained.followers=g;
gained.coins=botCoinRate()*dt;
addCoins(gained.coins);
S.currencies.energy=Math.min(maxEnergy(),S.currencies.energy+maxEnergy()*0.3);
S.stats.offlineSessions++;
emit('offline',gained);
return real;
}
function format(){
var grant=legacyForCoins(S.meta.allTimeCoins)-S.currencies.legacy;
if(grant<=0)return{ok:false,why:'sin-legado'};
var keep={
meta:S.meta,profile:S.profile,settings:S.settings,
stats:S.stats
};
S=fresh();

S.meta=keep.meta;
S.meta.formatsDone++;
S.profile=keep.profile;
S.settings=keep.settings;
S.stats=keep.stats;
S.currencies.legacy=keep.meta.legacy+grant;
S.meta.legacy=S.currencies.legacy;
S.bank.price=12;
lastTick=Sec.now();
prevTot=null;
emit('format',{grant:grant,legacy:S.currencies.legacy});
return{ok:true,grant:grant};
}
function repair(o){

o.currencies.maxEnergy=12+(o.upg['e-max']||0)+(o.upg['i-energy']||0);
o.currencies.energy=Util.clamp(o.currencies.energy,0,o.currencies.maxEnergy);
o.data.maxMB=2000+500*(o.upg['d-cap']||0);
o.data.mb=Util.clamp(o.data.mb,0,o.data.maxMB);
o.av.level=o.upg['av-level']||0;
o.av.firewall=o.upg['av-fw']||0;
o.bots.count=o.upg['b-count']||0;

if(!isFinite(o.meta.nodesDrained)||o.meta.nodesDrained<0)o.meta.nodesDrained=(o.stats&&o.stats.hacks)||0;
if(!isFinite(o.meta.bossesDrained)||o.meta.bossesDrained<0)o.meta.bossesDrained=0;
if(!o.events.nextMalwareAt)o.events.nextMalwareAt=0;
if(!o.browser)o.browser={impressions:0,auto:0,clicks:0};
if(!o.games)o.games={pinball:0,pinballCash:0,pool:0,poolWins:0};
if(!o.docs)o.docs=[];

if(o.run&&typeof o.run==='object'){
o.run.modifiers=o.run.modifiers||[];
o.run.modIds=o.run.modIds||o.run.modifiers.map(function(m){return m.id;});
o.run.objective=o.run.objective||null;
o.run.stats=o.run.stats||{drains:0,crack:0,bruteforce:0,tools:{},maxTrace:0};
o.run.combo=o.run.combo||0;
o.run.comboBest=o.run.comboBest||0;
}
return o;
}
function loadGame(){
prevTot=null;

if(NS.Sec&&NS.Sec.reload)NS.Sec.reload();
var res=NS.Save.load();
if(res.ok){
S=repair(res.state);
offlineApplied=false;
lastTick=Sec.now();
return{ok:true,restored:false};
}
if(res.tampered){
var backup=NS.Save.loadBackup();
if(backup){
S=repair(backup);
offlineApplied=false;
lastTick=Sec.now();
NS.Save.save(S);
return{ok:true,restored:true};
}

S=fresh();
Sec.quarantine('Guardado modificado detectado al cargar');
lastTick=Sec.now();
return{ok:true,fresh:true,quarantined:true};
}
S=fresh();
lastTick=Sec.now();
return{ok:true,fresh:true};
}
function newGame(){
NS.Save.wipe();
S=fresh();
lastTick=Sec.now();
offlineApplied=false;
prevTot=null;
emit('reset');
}
function saveNow(){
if(!S||Sec.isQuarantined())return false;
S.meta.lastSeen=Sec.now();
return NS.Save.save(S);
}
function get(){return S;}
function snapshot(){return Util.deepCopy(S);}
function verify(){
if(!S||Sec.isQuarantined())return true;
var c=S.currencies;
var bad=function(v){return typeof v!=='number'||!isFinite(v)||v<0;};
var ok=true;
if(bad(c.cash)||bad(c.novaCoins)||bad(c.xp)||bad(c.energy)||bad(c.level))ok=false;
if(c.level<1)ok=false;
if(c.energy>maxEnergy()+0.5)ok=false;
if(bad(S.bank.balance)||bad(S.bank.loanDebt))ok=false;
if(S.bank.price<4||S.bank.price>62||!isFinite(S.bank.price))ok=false;
if(bad(S.data.mb)||S.data.mb>S.data.maxMB+0.5)ok=false;
if(bad(S.social.followers)||bad(S.bots.count))ok=false;
Object.keys(S.inventory.tools).forEach(function(k){
if(bad(S.inventory.tools[k]))ok=false;
});
Object.keys(S.upg).forEach(function(k){
var v=S.upg[k];
if(typeof v!=='number'||!isFinite(v)||v<0||v>100000||Math.floor(v)!==v)ok=false;
});
if(S.run){
var r=S.run;
if(bad(r.trace)||r.trace>100||bad(r.loot.data)||bad(r.loot.cash))ok=false;
}



var dtS=2.5;
var cont=(S.bank.balance*bankRate()+S.social.followers*socialAdRate())*dtS*5;
var lumpy=S.data.maxMB*dataPrice()*1.5;
var click=(S.browser.impressions||0)*0.04*Math.pow(2,S.browser.cpmLvl||0);
var loans=S.bank.loanDebt*0.25;
var coinSell=S.currencies.novaCoins*S.bank.price;
var expected=cont+lumpy+click+loans+coinSell+30000;
var tot=S.currencies.cash+S.bank.balance;
if(prevTot!==null&&tot-prevTot>expected)ok=false;
prevTot=tot;
if(!ok)Sec.quarantine('Estado manipulado en memoria (valores inválidos)');
return ok;
}
S=fresh();
NS.State=Sec.sealApi({
fresh:fresh,get:get,snapshot:snapshot,on:on,verify:verify,
tick:tick,offline:offline,loadGame:loadGame,newGame:newGame,saveNow:saveNow,
addCash:addCash,spendCash:spendCash,addCoins:addCoins,spendCoins:spendCoins,
addXP:addXP,addEnergy:addEnergy,spendEnergy:spendEnergy,
addFollowers:addFollowers,addDataMB:addDataMB,sellDataMB:sellDataMB,
buyUpgrade:buyUpgrade,buyImplant:buyImplant,buyTool:buyTool,useTool:useTool,
loanTake:loanTake,loanRepay:loanRepay,
deposit:deposit,withdraw:withdraw,
buyCoins:buyCoins,sellCoins:sellCoins,makePost:makePost,format:format,
bankRate:bankRate,socialAdRate:socialAdRate,followerGrowthRate:followerGrowthRate,
botCoinRate:botCoinRate,energyRegen:energyRegen,maxEnergy:maxEnergy,
dataPrice:dataPrice,dataMaxMB:dataMaxMB,botCount:botCount,
xpForLevel:xpForLevel,incomeMult:incomeMult
});
})();
</script>
<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var defs={};
var wins={};
var zCounter=100;
var cascade=0;
var drag=null;
var appDefs={};
var Apps={
register:function(def){
appDefs[def.id]=def;
NS.WM.register(def);
},
list:function(){return Object.keys(appDefs).map(function(k){return appDefs[k];});},
get:function(id){return appDefs[id];},
desktop:function(){return Object.keys(appDefs).filter(function(k){return appDefs[k].desktop;}).map(function(k){return appDefs[k];});}
};
NS.Apps=Apps;
function layer(){return Util.$('#windows-layer');}
function register(def){
def.single=def.single!==false;
defs[def.id]=def;
}
function isOpen(id){return!!wins[id];}
function open(id){
var def=defs[id];
if(!def)return null;
if(def.single&&wins[id]){focus(id);return wins[id];}
var win={def:def,minimized:false,maximized:false,rect:null};
var dom=Util.el('div',{class:'window',id:'win-'+def.id});
var tb=Util.el('div',{class:'win-titlebar'});
var title=Util.el('div',{class:'wt-title'});
var ico=Util.svgIcon(def.icon);
title.appendChild(ico);
title.appendChild(Util.el('span',{text:def.title}));
var btns=Util.el('div',{class:'win-btns'});
var bMin=Util.el('button',{class:'wc-min',text:'_',title:'Minimizar'});
var bMax=Util.el('button',{class:'wc-max',text:'□',title:'Maximizar'});
var bCls=Util.el('button',{class:'wc-close',text:'✕',title:'Cerrar'});
bMin.addEventListener('click',function(e){e.stopPropagation();minimize(id);});
bMax.addEventListener('click',function(e){e.stopPropagation();toggleMaximize(id);});
bCls.addEventListener('click',function(e){e.stopPropagation();close(id);});
btns.appendChild(bMin);btns.appendChild(bMax);btns.appendChild(bCls);
tb.appendChild(title);tb.appendChild(btns);
var body=Util.el('div',{class:'win-body'});
dom.appendChild(tb);dom.appendChild(body);

if(def.status){
var sb=Util.el('div',{class:'win-statusbar'});
sb.innerHTML='<span class="ws-status"></span><span style="flex:1"></span>';
dom.appendChild(sb);
win.statusbar=Util.$('.ws-status',sb);
}
layer().appendChild(dom);
var w=Math.min(def.w||480,window.innerWidth-40);
var h=Math.min(def.h||360,window.innerHeight-80);
var x=def.x!==undefined?def.x:40+(cascade%8)*26;
var y=def.y!==undefined?def.y:20+(cascade%8)*22;
cascade++;
dom.style.width=w+'px';
dom.style.height=h+'px';
dom.style.left=Math.max(0,x)+'px';
dom.style.top=Math.max(0,y)+'px';
wins[id]=win;win.dom=dom;win.body=body;
dom.dataset.app=def.id;

tb.addEventListener('mousedown',function(e){onDragStart(e,id,dom);});
if(def.onOpen)def.onOpen(win);
if(def.render)def.render(body,win);
focus(id);
refreshTaskbar();
return win;
}
function onDragStart(e,id,dom){
if(e.target.closest('.win-btns'))return;
if(wins[id].maximized)return;
focus(id);
drag={
id:id,dom:dom,
dx:e.clientX-dom.offsetLeft,dy:e.clientY-dom.offsetTop,
moved:false
};
document.addEventListener('mousemove',onDragMove);
document.addEventListener('mouseup',onDragEnd);
e.preventDefault();
}
function onDragMove(e){
if(!drag)return;
drag.moved=true;
var x=Util.clamp(e.clientX-drag.dx,-200,window.innerWidth-40);
var y=Util.clamp(e.clientY-drag.dy,0,window.innerHeight-60);
drag.dom.style.left=x+'px';
drag.dom.style.top=y+'px';
}
function onDragEnd(){
drag=null;
document.removeEventListener('mousemove',onDragMove);
document.removeEventListener('mouseup',onDragEnd);
}
function focus(id){
var win=wins[id];
if(!win)return;
zCounter++;
win.dom.style.zIndex=zCounter;
Object.keys(wins).forEach(function(k){
wins[k].dom.classList.toggle('focused',k===id);
});
if(win.minimized){win.minimized=false;win.dom.classList.remove('minimized');win.dom.style.display='';}
refreshTaskbar();
}
function minimize(id){
var win=wins[id];
if(!win)return;
win.minimized=true;
win.dom.style.display='none';
refreshTaskbar();
}
function toggleMaximize(id){
var win=wins[id];
if(!win)return;
if(!win.maximized){
win.rect={w:win.dom.style.width,h:win.dom.style.height,l:win.dom.style.left,t:win.dom.style.top};
win.dom.classList.add('maximized');
win.dom.style.width='100%';
win.dom.style.height='calc(100% - 0px)';
win.dom.style.left='0';
win.dom.style.top='0';
win.maximized=true;
}else{
win.dom.classList.remove('maximized');
win.dom.style.width=win.rect.w;win.dom.style.height=win.rect.h;
win.dom.style.left=win.rect.l;win.dom.style.top=win.rect.t;
win.maximized=false;
}
}
function close(id){
var win=wins[id];
if(!win)return;
if(win.def.onClose){try{win.def.onClose(win);}catch(e){}}
if(win.dom.parentNode)win.dom.parentNode.removeChild(win.dom);
delete wins[id];
refreshTaskbar();
}
function rerender(id){
var win=wins[id];
if(!win)return;
win.body.innerHTML='';
if(win.def.render)win.def.render(win.body,win);
}
function refreshTaskbar(){
if(NS.Taskbar)NS.Taskbar.refresh();
}
function tickAll(){
Object.keys(wins).forEach(function(id){
var win=wins[id];
if(!win||win.minimized)return;
var def=win.def;
if(def.tick){try{def.tick(win);}catch(e){}}
if(def.status&&win.statusbar){
var txt=def.status(NS.State.get());
win.statusbar.textContent=txt===undefined?'':txt;
}
});
}
function openDefs(){return defs;}
function openList(){
return Object.keys(wins).map(function(id){
return{id:id,win:wins[id],def:defs[id]};
});
}
NS.WM={
register:register,open:open,close:close,focus:focus,
minimize:minimize,toggleMaximize:toggleMaximize,rerender:rerender,
isOpen:isOpen,openDefs:openDefs,openList:openList,
tickAll:tickAll,layer:layer
};
})();
</script>
<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var malwareBusy=false;
var lastThreat=null;
function pickMalware(){
var list=NS.Catalog.MALWARE;
return list[Math.floor(Math.random()*list.length)];
}
function threatLevel(mw){

var s=NS.State.get();
return 2+(s.upg['av-level']||0)+(s.upg['av-fw']||0);
}
function resolveMalware(mw){
var s=NS.State.get();
var prot=threatLevel(mw);
var chance=Util.clamp(0.25+prot*0.075,0,0.95);
var success=Math.random()<chance;
var UI=NS.UI;
if(success){
s.av.malwareStopped++;
s.meta.threatsStopped++;
NS.State.addXP(6+prot*2);
if(UI)UI.toast('Amenaza neutralizada','NovaShield bloqueó «'+mw.name+'» ('+Math.round(chance*100)+' % de éxito).','good','ic-shield');
NS.Audio.ok();
}else{
s.stats.traces=(s.stats.traces||0)+1;
var lossCash=0;
if(mw.loss==='cash')lossCash=s.currencies.cash*(0.04+Math.random()*0.06);
else if(mw.loss==='data'){
var lossData=s.data.mb*(0.1+Math.random()*0.15);
s.data.mb=Math.max(0,s.data.mb-lossData);
}else{
lossCash=s.currencies.cash*0.05;
}
if(lossCash>0){
s.currencies.cash=Math.max(0,s.currencies.cash-lossCash);
NS.State.addXP(1);
}
if(UI)UI.toast('¡Infección!','«'+mw.name+'» superó tus defensas'+(lossCash>0?' y te costó '+Util.fmtMoney(lossCash):' y borró parte de tus datos')+'. Mejora NovaShield.','important','ic-shield-bad');
NS.Audio.warn();
}
malwareBusy=false;
}
function onMalware(){
if(malwareBusy)return;
if(NS.Sec.isQuarantined())return;
var mw=pickMalware();
lastThreat=mw;
malwareBusy=true;
var UI=NS.UI;
NS.Audio.warn();
if(!UI||!UI.dialog){resolveMalware(mw);return;}
var s=NS.State.get();
var prot=threatLevel(mw);
var chance=Util.clamp(0.25+prot*0.075,0,0.95);
UI.dialog({
title:'¡Amenaza detectada!',
icon:'ic-shield-bad',
message:'NovaShield ha interceptado: <b>'+Util.esc(mw.name)+'</b><br><br>'+
Util.esc(mw.desc)+'<br><br>Protección actual: <b>'+prot+'</b> — Probabilidad de bloquearlo: <b>'+Math.round(chance*100)+' %</b>',
buttons:[
{label:'Ejecutar NovaShield',value:'go',primary:true},
{label:'Ignorar',value:'ignore'}
]
}).then(function(v){
if(v==='go')resolveMalware(mw);
else{

if(Math.random()<0.15){resolveMalware(mw);}
else{
malwareBusy=false;
var s2=NS.State.get();
var l=s2.currencies.cash*0.03;
s2.currencies.cash=Math.max(0,s2.currencies.cash-l);
if(UI)UI.toast('Sistema comprometido','Ignoraste la amenaza y perdiste '+Util.fmtMoney(l)+'.','important','ic-warning');
}
}
});
}
function onAd(){
var UI=NS.UI;
if(!UI)return;
var gifts=['¡Has ganado un cupón de 5 $!','¡Descarga gratis el protector de pantalla!','¡Tu PC está en riesgo! ¡Limpia YA!','¡Conoce a nuevas personas en NovaChat!','¡Internet Explorer es lento! ¡Prueba NovaSurf!'];
var g=gifts[Math.floor(Math.random()*gifts.length)];
UI.toast('Anuncio emergente',g+' <span style="color:#888">(ventana emergente)</span>','ad','ic-info');
}
function hook(type,payload){
var UI=NS.UI;
switch(type){
case'malware':onMalware();break;
case'ad':onAd();break;
case'levelup':
if(UI)UI.toast('¡Nivel '+payload.level+'!','Tu habilidad de hacker aumenta. +2 % de ingresos por nivel.','good','ic-star');
NS.Audio.ok();
break;
case'offline':
if(UI)UI.toast('Informe de ausencia','Mientras no estabas: '+Util.fmtMoney(payload.interest)+' de intereses, '+Util.fmtMoney(payload.cash)+' de publicidad y '+payload.coins.toFixed(3).replace('.',',')+' NovaCoins minados.','good','ic-info');
NS.Audio.notify();
break;
case'dataOverflow':
if(UI)UI.toast('Disco lleno','No cabían '+Util.fmtBytes(payload.lost*1024*1024)+' de datos. Vende datos en Mis Archivos.','important','ic-warning');
break;
case'format':
if(UI)UI.toast('Formato completado','Tu legado crece: +'+payload.grant+' puntos de legado (+3 % de ingresos cada uno).','good','ic-gear');
NS.Audio.startup();
break;
case'quarantine':
if(UI)UI.toast('¡Integridad comprometida!','Se detectó una manipulación del juego. El sistema entra en CUARENTENA: no se guardará el progreso hasta restaurar.','important','ic-error');
NS.Audio.error();
break;
case'upgrade':
NS.Audio.cash();
break;
case'post':
if(payload&&payload.gained>0)NS.Audio.cash();
break;
}
}
function init(){

<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
function circleCollide(a,b){
var dx=b.x-a.x,dy=b.y-a.y;
var dist=Math.sqrt(dx*dx+dy*dy);
var min=a.r+b.r;
if(dist===0||dist>min)return false;

var nx=dx/dist,ny=dy/dist;
var overlap=min-dist;
var ma=a.m||(a.r*a.r),mb=b.m||(b.r*b.r);
var total=ma+mb;
a.x-=nx*overlap*(mb/total);
a.y-=ny*overlap*(mb/total);
b.x+=nx*overlap*(ma/total);
b.y+=ny*overlap*(ma/total);

var rvx=b.vx-a.vx,rvy=b.vy-a.vy;
var vn=rvx*nx+rvy*ny;
if(vn>0)return true;
var j=-(1+0.9)*vn/(1/ma+1/mb);
a.vx-=(j/ma)*nx;a.vy-=(j/ma)*ny;
b.vx+=(j/mb)*nx;b.vy+=(j/mb)*ny;
return true;
}
function wallBounce(b,x0,y0,x1,y1){
var hit=false;
if(b.x-b.r<x0){b.x=x0+b.r;b.vx=Math.abs(b.vx)*0.85;hit=true;}
else if(b.x+b.r>x1){b.x=x1-b.r;b.vx=-Math.abs(b.vx)*0.85;hit=true;}
if(b.y-b.r<y0){b.y=y0+b.r;b.vy=Math.abs(b.vy)*0.85;hit=true;}
else if(b.y+b.r>y1){b.y=y1-b.r;b.vy=-Math.abs(b.vy)*0.85;hit=true;}
return hit;
}
function pocketed(b,px,py,pr){
var dx=b.x-px,dy=b.y-py;
return dx*dx+dy*dy<pr*pr;
}
function segmentCollide(b,p1,p2,r){
var ex=p2.x-p1.x,ey=p2.y-p1.y;
var len2=ex*ex+ey*ey;
if(len2===0)return null;
var t=((b.x-p1.x)*ex+(b.y-p1.y)*ey)/len2;
t=Math.max(0,Math.min(1,t));
var px=p1.x+ex*t,py=p1.y+ey*t;
var dx=b.x-px,dy=b.y-py;
var dist=Math.sqrt(dx*dx+dy*dy);
if(dist>r||dist===0)return null;
var nx=dx/dist,ny=dy/dist;
b.x=px+nx*r;b.y=py+ny*r;
var vn=b.vx*nx+b.vy*ny;
if(vn<0){
b.vx-=(1+0.7)*vn*nx;
b.vy-=(1+0.7)*vn*ny;
}
return{nx:nx,ny:ny,t:t};
}
function stepBalls(balls,dt){
for(var i=0;i<balls.length;i++){
var b=balls[i];
b.x+=b.vx*dt;
b.y+=b.vy*dt;
}
for(var k=0;k<balls.length;k++){
for(var j=k+1;j<balls.length;j++){
circleCollide(balls[k],balls[j]);
}
}
}
NS.Physics={
circleCollide:circleCollide,
wallBounce:wallBounce,
pocketed:pocketed,
segmentCollide:segmentCollide,
stepBalls:stepBalls
};
})();
</script>

var booting=false;

function setBootVis(vis){
var el=NS.Util.$('#boot-screen');

}

if(booting||bootDone)return;

var biosEl=NS.Util.$('#boot-bios');

(function step(){

line('   Máscara...........: 255.255.255.0','');
line('   Puerta de enlace..: 192.168.1.1','');
line('   DNS...............: 8.8.4.4 / 8.8.8.8','dim');
break;
case'whoami':line('novavista\\'+S.profile.name.toLowerCase().replace(/[^a-z0-9]/g,''),'ok');break;
case'conectar':case'connect':
line('Abriendo el mapa de red...','ok');
NS.WM.open('net');
break;
case'format':
NS.UI.confirm('Formatear C:','¿Seguro? Esto es el prestige del juego. Requiere NovaCoins acumuladas en total. ¿Abrir el panel de control?')
.then(function(ok){if(ok)NS.WM.open('settings');});

line('Abriendo NovaNet Explorer...','ok');
NS.WM.open('browser');

line('Abriendo el Manual de NovaVista...','ok');

line('> Accediendo al mainframe... [OK]','ok');

line('> Descargando contraseñas... [OK]','ok');
line('ADVERTENCIA: hackear el propio sistema no te dará dinero de verdad.','warn');

break;
case'matrix':
line('01001110 01101111 01110110 01100001 01010110 01101001 01110011 01110100 01100001','ok');

case'gato':

line(' ( o.o )   ¡miau!','ok');

function render(body){
body.innerHTML='';
body.className='term-body';
outEl=Util.el('div',{class:'term-out'});
var inputRow=Util.el('div',{class:'term-inrow'});
var prompt=Util.el('span',{class:'term-prompt',text:'C:\\>'});
inputEl=Util.el('input',{class:'term-in',type:'text',autocomplete:'off',spellcheck:'false'});
inputRow.appendChild(prompt);
inputRow.appendChild(inputEl);
body.appendChild(outEl);
body.appendChild(inputRow);
banner();
inputEl.focus();
inputEl.addEventListener('keydown',function(e){
if(e.key==='Enter'){
var v=inputEl.value;
line('C:\\>'+v,'cmd');
exec(v);
if(v.trim()){history.push(v);histIdx=history.length;}
inputEl.value='';
e.preventDefault();
}else if(e.key==='ArrowUp'){
e.preventDefault();
if(histIdx>0){histIdx--;inputEl.value=history[histIdx]||'';}
}else if(e.key==='ArrowDown'){
e.preventDefault();
if(histIdx<history.length){histIdx++;inputEl.value=history[histIdx]||'';}
}
});
setTimeout(function(){try{inputEl.focus();}catch(e){}},60);
}

function notify(title,body,icon){
notifs.unshift({title:title,body:body,icon:icon||'ic-mail',at:Date.now()});
if(notifs.length>40)notifs.length=40;
refreshBadge();
if(NS.WM.isOpen('email'))NS.WM.rerender('email');
}
function questProgress(s,q){
var v=q.check(s);
return Math.min(v,q.target);
}
function render(body){
var S=NS.State.get();
body.innerHTML='';
body.className='app-pad';
var title=Util.el('div',{class:'mail-title',text:'Bandeja de entrada'});
body.appendChild(title);
var box=Util.el('div',{class:'panel'});
box.appendChild(Util.el('div',{class:'panel-title',text:'Misiones'}));
NS.Catalog.QUESTS.forEach(function(q){
var st=S.quests[q.id]||{};
var prog=questProgress(S,q);
var done=prog>=q.target;
var claimed=!!st.claimed;
var r=Util.el('div',{class:'mail-row'+(done&&!claimed?' mail-done':'')});
r.appendChild(Util.svgIcon(done?'ic-star':'ic-mail'));
var info=Util.el('div',{style:{flex:'1'}});
info.appendChild(Util.el('div',{class:'mail-subj',text:q.title+(claimed?' ✓':'')}));
info.appendChild(Util.el('div',{class:'cfg-sub',text:q.desc}));
var bar=Util.el('div',{class:'xp-progress',style:{height:'10px',marginTop:'4px'}});
var fill=Util.el('div',{});
fill.style.width=Math.min(100,prog/q.target*100)+'%';
bar.appendChild(fill);
info.appendChild(bar);
info.appendChild(Util.el('div',{class:'cfg-sub',text:Util.fmtInt(prog)+' / '+Util.fmtInt(q.target)+' — Recompensa: '+q.reward+' NovaCoins'}));
r.appendChild(info);
if(done&&!claimed){
var btn=Util.el('button',{class:'xp-btn small primary',text:'Reclamar'});
btn.addEventListener('click',function(){
S.quests[q.id]={claimed:true,at:Date.now()};
NS.State.addCoins(q.reward);
NS.Audio.cash();
NS.UI.toast('Misión completada','«'+Util.esc(q.title)+'» — +'+q.reward+' NovaCoins.','good','ic-coin');
refreshBadge();
NS.WM.rerender('email');
});
r.appendChild(btn);
}else if(claimed){
r.appendChild(Util.el('span',{class:'cfg-sub',text:'reclamada'}));
}
box.appendChild(r);
});
body.appendChild(box);
var box2=Util.el('div',{class:'panel'});
box2.appendChild(Util.el('div',{class:'panel-title',text:'Notificaciones del sistema'}));
if(!notifs.length){
box2.appendChild(Util.el('div',{class:'cfg-info',text:'Aún no hay notificaciones. Los resultados de tus asaltos aparecerán aquí.'}));
}else{
notifs.forEach(function(n){
var r=Util.el('div',{class:'mail-row'});
r.appendChild(Util.svgIcon(n.icon));
var info=Util.el('div',{style:{flex:'1'}});
info.appendChild(Util.el('div',{class:'mail-subj',text:n.title+' — '+Util.fmtClock(n.at)}));
info.appendChild(Util.el('div',{class:'cfg-sub',html:n.body}));
r.appendChild(info);
box2.appendChild(r);
});
}
body.appendChild(box2);
}
NS.Apps.register({
id:'email',title:'NovaMail',icon:'ic-mail',
desktop:true,w:540,h:460,minW:440,minH:360,
render:render
});

})();

function genNode(rng,kind,lvl,name,conn){
var fw=1+Math.floor(lvl/2)+(rng()<0.45?1:0);
var vulns=[];
var pool=['buffer','openport','weakpass','backdoor'];
var nv=rng()<0.3?0:rng()<0.7?1:2;
for(var i=0;i<nv;i++){
var v=pool[Math.floor(rng()*pool.length)];
if(vulns.indexOf(v)===-1)vulns.push(v);
}
return{
id:'n'+Math.floor(rng()*1e9).toString(36),
kind:kind,name:name,
lvl:lvl,
fw:kind==='isp'?0:fw,
fwMax:fw,
trace:3+lvl*2+Math.floor(rng()*4),
data:Math.round(Math.pow(lvl,1.35)*15*(0.8+rng()*0.6)),
cash:Math.round(Math.pow(lvl,2.05)*40*(0.8+rng()*0.5)),
coins:kind==='dark'?2+Math.floor(rng()*4):0,
coinsChance:kind==='dark'?0.65:kind==='boss'?1:0,
vulns:vulns,
conn:conn||[],
explored:kind==='isp',
drained:false,
usedVulns:{}
};
}
function genRun(seed){
var rng=Util.mulberry32(seed>>>0);
var nodes=[];
var boss;
var isp=genNode(rng,'isp',0,'Proveedor ISP (tú)',[]);
nodes.push(isp);
function addLayer(count,kinds,lvlMin,lvlMax){
var layer=[];
for(var i=0;i<count;i++){
var k=kinds[Math.floor(rng()*kinds.length)];
var lvl=lvlMin+Math.floor(rng()*(lvlMax-lvlMin+1));
var n=genNode(rng,k,lvl,NAMES[k][Math.floor(rng()*NAMES[k].length)],[]);
nodes.push(n);
layer.push(n);
}
return layer;
}
var d1=addLayer(2+Math.floor(rng()*2),['home','home','cafe'],1,3);
var d2=addLayer(2+Math.floor(rng()*2),['office','office','news'],3,5);
var d3=addLayer(1+Math.floor(rng()*2),['bank','bank','corp'],5,8);
var d4=addLayer(1,['dark'],7,9);
boss=genNode(rng,'boss',10,'MASTER SERVER',[]);
boss.data=4000+Math.floor(rng()*2000);
boss.cash=25000+Math.floor(rng()*15000);
boss.coins=8+Math.floor(rng()*10);
nodes.push(boss);

isp.conn=d1.map(function(n){return n.id;});
function wire(prev,next){
prev.forEach(function(p,i){
var targets=next.slice();

var picks=1+(rng()<0.6?1:0);
for(var k=0;k<picks&&targets.length;k++){
var t=targets.splice(Math.floor(rng()*targets.length),1)[0];
p.conn.push(t.id);
}
if(!p.conn.length&&next.length)p.conn.push(next[0].id);
});
}
wire(d1,d2);
wire(d2,d3);
wire(d3,d4);
d4.forEach(function(n){n.conn.push(boss.id);});

if(rng()<0.3)d2[Math.floor(rng()*d2.length)].conn.push(boss.id);
var MODIFIERS=[
{id:'vigilada',kind:'bad',name:'Red vigilada',desc:'+25 % de rastro por acción'},
{id:'hora-punta',kind:'bad',name:'Hora punta',desc:'+1 de energía por acción'},
{id:'silenciosa',kind:'good',name:'Red silenciosa',desc:'-20 % de rastro por acción'},
{id:'agujeros',kind:'good',name:'Red con agujeros',desc:'Los nodos tienen más vulnerabilidades'},
{id:'criptico',kind:'good',name:'Nodos cripticos',desc:'+50 % de NovaCoins'},
{id:'aquelarre',kind:'good',name:'Noche de aquelarre',desc:'Menos firewall en las capas iniciales'}
];
var bads=MODIFIERS.filter(function(m){return m.kind==='bad';});
var goods=MODIFIERS.filter(function(m){return m.kind==='good';});
var modifiers=[
bads[Math.floor(rng()*bads.length)],
goods[Math.floor(rng()*goods.length)]
];
if(rng()<0.35)modifiers.push(goods[Math.floor(rng()*goods.length)]);
var modIds=modifiers.map(function(m){return m.id;});

if(modIds.indexOf('agujeros')!==-1){
var vpool=['buffer','openport','weakpass','backdoor'];
nodes.forEach(function(n){
if(n.kind==='isp'||n.kind==='boss')return;
if(rng()<0.7&&n.vulns.length<2){
var v=vpool[Math.floor(rng()*vpool.length)];
if(n.vulns.indexOf(v)===-1)n.vulns.push(v);
}
});
}
if(modIds.indexOf('aquelarre')!==-1){
nodes.forEach(function(n){
if(n.lvl<=4&&n.fw>1)n.fw=Math.max(1,n.fw-1);
if(n.lvl<=4)n.fwMax=n.fw;
});
}
if(modIds.indexOf('criptico')!==-1){
nodes.forEach(function(n){
if(n.kind==='dark'||n.kind==='boss')n.coins=Math.round(n.coins*1.5);
});
}
var OBJECTIVES=[
{id:'o-no-bruteforce',desc:'Termina sin usar BRUTEFORCE',bonus:4,check:function(r){return r.stats.bruteforce===0;}},
{id:'o-low-trace',desc:'Cobra con el rastro por debajo de 40',bonus:3,check:function(r){return r.trace<40;}},
{id:'o-4-drains',desc:'Drena al menos 4 nodos',bonus:3,check:function(r){return r.stats.drains>=4;}},
{id:'o-2-tools',desc:'Usa 2 herramientas distintas',bonus:4,check:function(r){return Object.keys(r.stats.tools).length>=2;}},
{id:'o-no-crack',desc:'Termina sin usar CRACK',bonus:5,check:function(r){return r.stats.crack===0;}},
{id:'o-calm',desc:'Nunca superes 60 de rastro',bonus:4,check:function(r){return r.stats.maxTrace<=60;}}
];
var objective=OBJECTIVES[Math.floor(rng()*OBJECTIVES.length)];
return{
seed:seed,nodes:nodes,ispId:isp.id,bossId:boss.id,
trace:0,loot:{data:0,cash:0},tools:{},
status:'active',startedAt:Date.now(),mapRevealed:false,
summary:null,
modifiers:modifiers,modIds:modIds,objective:objective,
combo:0,comboBest:0,
stats:{drains:0,crack:0,bruteforce:0,tools:{},maxTrace:0}
};
}
function nodeById(run,id){
for(var i=0;i<run.nodes.length;i++)if(run.nodes[i].id===id)return run.nodes[i];
return null;
}
function isReachable(run,node){
if(node.kind==='isp')return true;

for(var i=0;i<run.nodes.length;i++){
var p=run.nodes[i];
if(p.id===node.id)continue;
if((p.kind==='isp'||p.drained)&&p.conn.indexOf(node.id)!==-1)return true;
}
return false;
}
function hasTool(run,tid){
if(run.tools[tid]>0)return true;
return(NS.State.get().inventory.tools[tid]||0)>0;
}
function takeTool(run,tid){
if(run.tools[tid]>0){run.tools[tid]--;return true;}
if(NS.State.useTool(tid))return true;
return false;
}
function traceRisk(run,node){
var S=NS.State.get();
var stealth=1-0.04*(S.upg['i-stealth']||0);
var risk=node.trace*stealth*(0.85+Math.random()*0.3);
return Math.max(1,risk*runTraceMult(run));
}
function addTrace(run,node){
run.trace+=traceRisk(run,node);
if(run.trace>run.stats.maxTrace)run.stats.maxTrace=Math.floor(run.trace);
if(run.trace>=70&&run.trace<100&&!run.traceWarned){
run.traceWarned=true;
log('warn','¡CUIDADO! Rastro alto ('+Math.floor(run.trace)+'/100). Usa SIGILO o un PROXY.');
NS.Audio.trace();
}
if(run.trace>=100){
run.trace=100;

var S=NS.State.get();
var escapeChance=Util.clamp(0.6+0.04*(S.upg['i-stealth']||0),0,0.92);
if(Math.random()<escapeChance){
run.trace=40;
log('ok','¡Te escabulliste del rastreo a duras penas! Rastro reiniciado a 40.');
NS.Audio.trace();
refresh();
}else{
traced(run);
}
return true;
}
return false;
}
function spendE(run,n){

var cost=n+(run&&run.modIds&&run.modIds.indexOf('hora-punta')!==-1?1:0);
if(!NS.State.spendEnergy(cost))return false;
return true;
}
function runTraceMult(run){
var m=1;
if(run.modIds&&run.modIds.indexOf('vigilada')!==-1)m*=1.25;
if(run.modIds&&run.modIds.indexOf('silenciosa')!==-1)m*=0.8;
return m;
}
function lootMult(){
var S=NS.State.get();
return 1+0.1*(S.upg['i-loot']||0);
}
function toolDropChance(){
var S=NS.State.get();
return 0.12+0.04*(S.upg['i-tools']||0);
}
function actScan(run,node){
if(!isReachable(run,node))return log('err','No puedes alcanzar «'+node.name+'» todavía. Drena antes un nodo conectado.');
if(!spendE(run,1))return log('err','Energía insuficiente.');
node.explored=true;
var vulnTxt=node.vulns.length?node.vulns.map(vulnName).join(', '):'ninguna conocida';
log('ok','ESCANEO de '+node.name+' (nivel '+node.lvl+')');
log('dim','  Firewall: '+'▓'.repeat(node.fw)+'░'.repeat(node.fwMax-node.fw)+' · Vulnerabilidades: '+vulnTxt);
log('dim','  Botín estimado: '+Util.fmtBytes(node.data*1024*1024)+' · '+Util.fmtMoney(node.cash)+(node.coinsChance>0?' · posible monedas':''));
addTrace(run,node);
NS.State.addXP(2);
NS.Audio.tick();
refresh();
}
function actCrack(run,node){
if(!isReachable(run,node))return log('err','Nodo inalcanzable.');
if(node.fw<=0)return log('dim','El firewall de '+node.name+' ya está caído. Usa UPLOAD.');
if(!spendE(run,1))return log('err','Energía insuficiente.');
run.stats.crack++;
var S=NS.State.get();
var chance=0.55+0.12*(S.upg['i-cpu']||0);
if(node.usedVulns.openport)chance+=0.25;
var autoWin=node.usedVulns.weakpass?false:(node.vulns.indexOf('weakpass')!==-1);
if(autoWin){node.usedVulns.weakpass=true;chance=1;}
chance=Util.clamp(chance,0.15,0.95);
if(Math.random()<chance){
node.fw--;
log('ok','CRACK exitoso en '+node.name+' — capa de firewall eliminada ('+node.fw+' restantes).');
NS.State.addXP(3);
NS.Audio.hack();
}else{
log('warn','CRACK fallido en '+node.name+'. Aumenta el rastro...');
NS.Audio.error();
}
addTrace(run,node);
refresh();
}
function actExploit(run,node){
if(!isReachable(run,node))return log('err','Nodo inalcanzable.');
if(node.fw<=0)return log('dim','Sin firewall que explotar.');
var usesTool=false;
if(node.vulns.indexOf('buffer')===-1&&!hasTool(run,'exploit')){
return log('err','No hay vulnerabilidad de desbordamiento conocida en '+node.name+'. Escanéalo antes o usa un Kit de explotación.');
}
if(!spendE(run,1))return log('err','Energía insuficiente.');

if(node.vulns.indexOf('buffer')===-1){takeTool(run,'exploit');usesTool=true;run.stats.tools.exploit=1;}
node.usedVulns.buffer=true;
node.fw=Math.max(0,node.fw-1);
log('ok','EXPLOIT aplicado'+(usesTool?' (kit de explotación)':' (desbordamiento)')+'. Capa eliminada sin rastro ('+node.fw+' restantes).');
NS.State.addXP(4);
NS.Audio.hack();
refresh();
}
function actBruteforce(run,node){
if(!isReachable(run,node))return log('err','Nodo inalcanzable.');
if(node.fw<=0)return log('dim','El firewall ya está caído.');
if(!spendE(run,2))return log('err','Energía insuficiente (cuesta 2).');
run.stats.bruteforce++;
node.fw--;
log('warn','BRUTEFORCE: capa rota a la fuerza ('+node.fw+' restantes). El rastro aumenta mucho.');
addTrace(run,node);
addTrace(run,node);
NS.State.addXP(2);
NS.Audio.error();
refresh();
}
function actUpload(run,node){
if(!isReachable(run,node))return log('err','Nodo inalcanzable.');
if(node.drained)return log('dim','Ya drenaste '+node.name+'.');
if(node.fw>0)return log('err','El firewall de '+node.name+' sigue activo ('+node.fw+' capas).');
if(!spendE(run,2))return log('err','Energía insuficiente (cuesta 2).');

if(run.trace<50){run.combo++;}else{run.combo=0;}
if(run.combo>run.comboBest)run.comboBest=run.combo;
var comboMult=1+0.1*Util.clamp(run.combo-1,0,5);
if(run.combo>=2)log('ok','¡RACHA ×'+run.combo+'! +'+Math.round((comboMult-1)*100)+' % de botín.');
var payloadUsed=false;
if(hasTool(run,'payload')){
takeTool(run,'payload');
payloadUsed=true;
log('ok','Payload cifrado inyectado: +40 % de datos.');
}
var mult=lootMult()*(payloadUsed?1.4:1)*comboMult;
var d=Math.round(node.data*mult);
var c=Math.round(node.cash*mult);
run.loot.data+=d;
run.loot.cash+=c;
node.drained=true;
run.stats.drains++;
NS.State.get().stats.hacks++;
NS.State.get().meta.nodesDrained++;
NS.State.addXP(6+node.lvl*2);
var msg='UPLOAD completado en '+node.name+' — +'+Util.fmtBytes(d*1024*1024)+' de datos y '+Util.fmtMoney(c)+' al botín.';
if(node.coinsChance>0&&(node.kind==='boss'||Math.random()<node.coinsChance)){
NS.State.addCoins(node.coins);
msg+=' ¡+'+node.coins+' NovaCoins a tu cartera!';
}
log('ok',msg);
NS.Audio.hack();

if(Math.random()<toolDropChance()){
var tids=Object.keys(NS.Catalog.TOOLS);
var tid=tids[Math.floor(Math.random()*tids.length)];
NS.State.get().inventory.tools[tid]=(NS.State.get().inventory.tools[tid]||0)+1;
log('dim','Botín extra: 1× '+NS.Catalog.TOOLS[tid].name+'.');
}
addTrace(run,node);
if(node.kind==='boss'){
run.status='done';
run.summary='victory';
var bonus=10+Math.floor(Math.random()*15);
NS.State.addCoins(bonus);
NS.State.addXP(60);
NS.State.get().meta.bossesDrained++;
log('ok','★★★★★ MASTER SERVER DRENADO — ASALTO COMPLETADO ★★★★★');
log('ok','Bonus de victoria: +'+bonus+' NovaCoins y +60 XP.');
NS.Audio.startup();
endRun(true);
}
refresh();
}
function actStealth(run){
if(!spendE(run,1))return log('err','Energía insuficiente.');
run.trace=Math.floor(run.trace*0.7);
log('ok','SIGILO activado. Rastro reducido al 70 % ('+Math.floor(run.trace)+').');
NS.State.addXP(1);
NS.Audio.tick();
refresh();
}
function actProxy(run){
if(!takeTool(run,'proxy'))return log('err','No tienes servidores proxy.');
run.stats.tools.proxy=1;
run.trace=Math.floor(run.trace*0.5);
log('ok','PROXY quemado. Rastro reducido a la mitad ('+Math.floor(run.trace)+').');

refresh();
}
function actWorm(run){
if(!takeTool(run,'worm'))return log('err','No tienes gusanos.');

function actIcmp(run){

run.mapRevealed=true;
run.nodes.forEach(function(n){n.explored=true;});
log('ok','TÚNEL ICMP: se ha revelado todo el mapa de red.');

}
function actDecrypt(run,node){
if(!node||!node.explored)return log('err','Selecciona y escanea antes un nodo.');
var extra=['buffer','openport','weakpass','backdoor'].filter(function(v){return node.vulns.indexOf(v)===-1;});
if(!extra.length){log('dim','El nodo no tiene más vulnerabilidades que revelar.');return;}
if(!takeTool(run,'decrypt'))return log('err','No tienes descifradores.');
run.stats.tools.decrypt=1;
var v=extra[Math.floor(Math.random()*extra.length)];
node.vulns.push(v);
log('ok','DESCIFRADOR: vulnerabilidad revelada — '+vulnName(v));

function actDisconnect(run){
log('dim','Desconectando de la red...');
NS.Audio.tick();
endRun(false);
}
function vulnName(v){
return{buffer:'desbordamiento',openport:'puerto abierto',weakpass:'contraseña débil',backdoor:'puerta trasera'}[v]||v;
}
function commitLoot(run){
var S=NS.State.get();
var added=NS.State.addDataMB(run.loot.data);
NS.State.addCash(run.loot.cash);
return{data:added,cash:run.loot.cash};

function endRun(victoryRun){

var run=S.run;
if(!run)return;
S.run=null;
var bonusXP=0;
var drained=0;
run.nodes.forEach(function(n){if(n.drained)drained++;});
if(run.status==='traced'){
S.meta.runsTraced++;
NS.UI.toast('¡RASTREADO!','Te localizaron y perdiste el botín sin cobrar. Mantuviste las NovaCoins obtenidas.','important','ic-error');
NS.Audio.trace();
NS.Mail.notify('Alerta de rastreo','El asalto a la red terminó mal: te rastrearon y el botín se perdió. <b>Consejo:</b> usa stealth antes de cada acción y guarda proxies.','ic-error');

var title=victoryRun?'ASALTO COMPLETADO':'ASALTO FINALIZADO';
NS.UI.toast(title,'Cobraste '+Util.fmtMoney(loot.cash)+' y '+Util.fmtBytes(loot.data*1024*1024)+' de datos ('+drained+' nodos drenados, +'+bonusXP+' XP)'+(objMet?' · ¡Objetivo cumplido! +'+objBonus+' NC':'')+'.','good','ic-coin');
NS.Audio.cash();
NS.Mail.notify(title,'Resumen: <b>'+drained+'</b> nodos drenados · <b>'+Util.fmtMoney(loot.cash)+'</b> cobrados · <b>'+Util.fmtBytes(loot.data*1024*1024)+'</b> de datos'+(victoryRun?' · ¡MasterServer destruido!':'')+(objMet?' · Objetivo: <b>CUMPLIDO</b> (+'+objBonus+' NC)':'')+'.','ic-net');

if(drained>0){
var modsTxt=run.modifiers.map(function(m){return m.name;}).join(', ');
NS.UI.dialog({
title:title,icon:victoryRun?'ic-coin':'ic-net',
message:
'<b>Nodos drenados:</b> '+drained+'<br>'+
'<b>Dinero cobrado:</b> '+Util.fmtMoney(loot.cash)+'<br>'+
'<b>Datos al almacén:</b> '+Util.fmtBytes(loot.data*1024*1024)+'<br>'+
'<b>Mejor racha:</b> ×'+run.comboBest+' (+'+Math.min(50,run.comboBest>1?(run.comboBest-1)*10:0)+' % máx)<br>'+
'<b>XP ganada:</b> +'+bonusXP+'<br>'+
'<b>Objetivo del asalto:</b> '+(run.objective?Util.esc(run.objective.desc):'—')+' → <b>'+(objMet?'CUMPLIDO (+'+objBonus+' NC)':'no cumplido')+'</b><br>'+
'<b>Modificadores:</b> '+Util.esc(modsTxt),
buttons:[{label:'¡A por el siguiente!',value:true,primary:true}]
});
}
refresh();

function traced(run){

NS.State.get().stats.traces++;

var outEl=null;
var inpEl=null;
var mapEl=null;
var infoEl=null;
var curTab='mapa';
var selectedId=null;
var cmdHist=[];
var cmdIdx=0;

outEl.appendChild(div);
outEl.scrollTop=outEl.scrollHeight;

function refresh(){

S.run=run;
log('ok','=== NUEVO ASALTO ===');
log('dim','Conexión establecida con el Proveedor ISP.');

log('dim','Objetivo del asalto: '+run.objective.desc+' → +'+run.objective.bonus+' NovaCoins.');

renderMap();
renderTop();
}
function actionButtons(container,run,node){
var b=function(label,fn,disabled,title){
var btn=Util.el('button',{class:'xp-btn small',text:label,title:title||''});
btn.disabled=!!disabled;
btn.addEventListener('click',fn);
container.appendChild(btn);
};
if(!run||run.status!=='active')return;
var reach=node&&isReachable(run,node);
b('Escanear',function(){actScan(run,node);},!reach);
b('Crack',function(){actCrack(run,node);},!reach||(node&&node.fw<=0));
b('Exploit',function(){actExploit(run,node);},!reach||(node&&node.fw<=0));
b('Bruteforce',function(){actBruteforce(run,node);},!reach||(node&&node.fw<=0));
b('Descifrar',function(){actDecrypt(run,node);},!reach);

}
function renderTop(){
var top=Util.$('#net-top');
if(!top)return;
var S=NS.State.get();
var run=S.run;
var energyPct=S.currencies.energy/NS.State.maxEnergy()*100;
var html='';

function resolveNode(run,token){
token=String(token).toLowerCase();
for(var i=0;i<run.nodes.length;i++){
if(run.nodes[i].id===token||run.nodes[i].name.toLowerCase().indexOf(token)!==-1)return run.nodes[i];
}
return null;
}
function cmd(v){
var S=NS.State.get();
var parts=v.split(/\s+/);
var head=parts[0].toLowerCase();
var run=S.run;
if(!run&&head!=='conectar'&&head!=='connect'&&head!=='help'&&head!=='ayuda'&&head!=='?'){
log('err','No hay asalto activo. Escribe CONECTAR.');
return;
}
var target=parts[1]?(run?resolveNode(run,parts[1]):null):null;
switch(head){
case'conectar':case'connect':startRun();break;
case'scan':case'escaneo':if(target)actScan(run,target);else log('err','Uso: scan <nombre>');break;
case'crack':case'romper':if(target)actCrack(run,target);else log('err','Uso: crack <nombre>');break;
case'exploit':case'explotar':if(target)actExploit(run,target);else log('err','Uso: exploit <nombre>');break;
case'bruteforce':case'fuerza':if(target)actBruteforce(run,target);else log('err','Uso: bruteforce <nombre>');break;
case'upload':case'drenar':if(target)actUpload(run,target);else log('err','Uso: upload <nombre>');break;
case'stealth':case'sigilo':actStealth(run);break;
case'proxy':actProxy(run);break;
case'worm':case'gusano':actWorm(run);break;
case'icmp':actIcmp(run);break;
case'decrypt':case'descifrar':if(target)actDecrypt(run,target);else log('err','Uso: decrypt <nombre>');break;
case'disconnect':case'salir':actDisconnect(run);break;
case'trace':case'rastro':log('dim','Rastro actual: '+Math.floor(run.trace)+'/100.');break;
case'energy':case'energia':log('dim','Energía: '+Math.floor(S.currencies.energy)+'/'+NS.State.maxEnergy()+'.');break;
case'loot':case'botin':log('dim','Botín sin cobrar: '+Util.fmtBytes(run.loot.data*1024*1024)+' · '+Util.fmtMoney(run.loot.cash)+'.');break;
case'help':case'ayuda':case'?':
['scan <n> · crack <n> · exploit <n> · bruteforce <n>','upload <n> · stealth · proxy · worm · icmp','decrypt <n> · disconnect · trace · energy · loot','conectar — inicia un asalto'].forEach(function(l){log('dim',l);});
break;
default:log('err','Comando desconocido. Escribe help.');
}
}

<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var W=360,H=560;
var cv,ctx;
var raf=null;
var running=false;
var ball=null;
var score=0;
var ballsLeft=3;
var gameOver=false;
var lastTime=0;
var flipperL=false,flipperR=false;
var charging=false;
var launcher=0;
var waiting=false;
var BALL_R=8;
var GRAV=1500;

var WALL_TOP=8,WALL_SIDE=14;
var BOTTOM_Y=H-58;
var DRAIN_Y=H-40;
var GAP_HALF=52;
var CRADLE={x:W/2,y:H-50};
var FL_PIV_L={x:85,y:H-70};
var FL_PIV_R={x:W-85,y:H-70};
var FL_LEN=74;
var FL_REST=-0.32,FL_UP=-1.02;
var FL_SPEED=11;
var BUMPERS=[
{x:W*0.30,y:150,r:17},
{x:W*0.50,y:108,r:17},
{x:W*0.70,y:150,r:17}
];
function newGame(){
score=0;ballsLeft=3;gameOver=false;launcher=0;charging=false;
waiting=true;
ball={x:CRADLE.x,y:CRADLE.y,vx:0,vy:0,r:BALL_R,m:64};
}
function addScore(n){
score+=n;
NS.Audio.tick();
}
function onKeyDown(e){
if(!running)return;
if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')flipperL=true;
if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')flipperR=true;
if(e.key===' '){e.preventDefault();chargeLaunch();}
}
function onKeyUp(e){
if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')flipperL=false;
if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')flipperR=false;
if(e.key===' '){e.preventDefault();releaseLaunch();}
}
function chargeLaunch(){if(gameOver||!waiting)return;charging=true;}
function releaseLaunch(){
charging=false;
if(!waiting||!ball||gameOver)return;
if(launcher>5){
ball.vy=-(460+launcher*6.2);
ball.vx=(Math.random()-0.5)*70;
waiting=false;
launcher=0;
NS.Audio.hack();
}
}
function flipperEnds(pivot,angle,len){
return{x:pivot.x+Math.cos(angle)*len,y:pivot.y+Math.sin(angle)*len};
}
function step(dt){
if(gameOver||!ball)return;

if(waiting){
ball.x=CRADLE.x;ball.y=CRADLE.y;ball.vx=0;ball.vy=0;
if(charging)launcher=Math.min(100,launcher+2.4);
return;
}
ball.vy+=GRAV*dt;
ball.x+=ball.vx*dt;
ball.y+=ball.vy*dt;

if(ball.x-ball.r<WALL_SIDE){ball.x=WALL_SIDE+ball.r;ball.vx=Math.abs(ball.vx)*0.8;addScore(2);}
else if(ball.x+ball.r>W-WALL_SIDE){ball.x=W-WALL_SIDE-ball.r;ball.vx=-Math.abs(ball.vx)*0.8;addScore(2);}
if(ball.y-ball.r<WALL_TOP){ball.y=WALL_TOP+ball.r;ball.vy=Math.abs(ball.vy)*0.8;addScore(2);}

if(ball.x<W/2-GAP_HALF&&ball.y+ball.r>BOTTOM_Y){
ball.y=BOTTOM_Y-ball.r;ball.vy=-Math.abs(ball.vy)*0.8;
}
if(ball.x>W/2+GAP_HALF&&ball.y+ball.r>BOTTOM_Y){
ball.y=BOTTOM_Y-ball.r;ball.vy=-Math.abs(ball.vy)*0.8;
}

for(var i=0;i<BUMPERS.length;i++){
var b=BUMPERS[i];
var dx=ball.x-b.x,dy=ball.y-b.y;
var d=Math.sqrt(dx*dx+dy*dy);
if(d>0.001&&d<b.r+ball.r){
var nx=dx/d,ny=dy/d;
ball.x=b.x+nx*(b.r+ball.r+1);
ball.y=b.y+ny*(b.r+ball.r+1);
ball.vx+=nx*340;ball.vy+=ny*340;
addScore(25);
NS.Audio.ok();
}
}

var aL=FL_REST+(FL_UP-FL_REST)*(flipperL?1:0);
var aR=Math.PI-(FL_REST+(FL_UP-FL_REST)*(flipperR?1:0));
var eL=flipperEnds(FL_PIV_L,aL,FL_LEN);
var eR=flipperEnds(FL_PIV_R,aR,FL_LEN);
var hitL=NS.Physics.segmentCollide(ball,FL_PIV_L,eL,ball.r);
var hitR=NS.Physics.segmentCollide(ball,FL_PIV_R,eR,ball.r);
if(hitL||hitR){
var dir=hitL?1:-1;
var w=dir*FL_SPEED;
var tipV=w*FL_LEN;
ball.vx+=Math.cos(aL)*tipV*0.16;
ball.vy+=Math.sin(aL)*tipV*0.16-70;
addScore(10);
NS.Audio.ok();
}

if(ball.y>DRAIN_Y){
ballsLeft--;
NS.Audio.error();
if(ballsLeft<=0){
gameOver=true;
ball=null;
NS.Audio.shutdown();
renderOverlay();
}else{
waiting=true;
launcher=0;
charging=false;
ball={x:CRADLE.x,y:CRADLE.y,vx:0,vy:0,r:BALL_R,m:64};
}
}
}
function draw(){
if(!ctx)return;
ctx.fillStyle='#0a1440';
ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#2a4a8a';
ctx.lineWidth=3;

ctx.strokeRect(WALL_SIDE,WALL_TOP,W-WALL_SIDE*2,BOTTOM_Y-WALL_TOP);

ctx.fillStyle='#060a20';
ctx.fillRect(W/2-GAP_HALF,BOTTOM_Y,GAP_HALF*2,H-BOTTOM_Y);
ctx.strokeStyle='#8a3a2a';
ctx.strokeRect(W/2-GAP_HALF,BOTTOM_Y,GAP_HALF*2,H-BOTTOM_Y);

BUMPERS.forEach(function(b){
ctx.beginPath();
ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
ctx.fillStyle='#ff6b6b';
ctx.fill();
ctx.strokeStyle='#7a1c1c';
ctx.lineWidth=3;
ctx.stroke();
ctx.beginPath();
ctx.arc(b.x,b.y,b.r*0.45,0,Math.PI*2);
ctx.fillStyle='#ffe08a';
ctx.fill();
});

var aL=FL_REST+(FL_UP-FL_REST)*(flipperL?1:0);
var aR=Math.PI-(FL_REST+(FL_UP-FL_REST)*(flipperR?1:0));
drawFlipper(FL_PIV_L,aL);
drawFlipper(FL_PIV_R,aR);

if(ball){
ctx.beginPath();
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
ctx.fillStyle='#f8f8f8';
ctx.fill();
ctx.strokeStyle='#888';
ctx.stroke();
ctx.beginPath();
ctx.arc(ball.x-2,ball.y-2,2.4,0,Math.PI*2);
ctx.fillStyle='#fff';
ctx.fill();
}

ctx.fillStyle='#9ec5f5';
ctx.font='bold 16px Tahoma';
ctx.textAlign='left';
ctx.fillText('PUNTOS: '+Math.floor(score),16,28);
ctx.textAlign='right';
ctx.fillText('BOLAS: '+ballsLeft,W-16,28);
if(charging&&waiting){
ctx.fillStyle='#ffe08a';
ctx.fillRect(W/2-50,H-26,launcher,8);
ctx.strokeStyle='#fff';
ctx.strokeRect(W/2-50,H-26,100,8);
ctx.fillStyle='#fff';
ctx.textAlign='center';
ctx.font='11px Tahoma';
ctx.fillText('¡SUELTA ESPACIO!',W/2,H-34);
}else if(waiting){
ctx.fillStyle='#9ec5f5';
ctx.textAlign='center';
ctx.font='11px Tahoma';
ctx.fillText('MANTÉN ESPACIO PARA LANZAR',W/2,H-34);
}
}
function drawFlipper(pivot,angle){
var e=flipperEnds(pivot,angle,FL_LEN);
ctx.strokeStyle='#c03030';
ctx.lineWidth=13;
ctx.lineCap='round';
ctx.beginPath();
ctx.moveTo(pivot.x,pivot.y);
ctx.lineTo(e.x,e.y);
ctx.stroke();
ctx.lineCap='butt';
}
function renderOverlay(){
if(!cv)return;
var box=Util.$('#pinball-overlay');
if(box){
var S=NS.State.get();
var cash=Math.floor(score/50);
box.innerHTML='';
box.classList.remove('hidden');
box.appendChild(Util.el('div',{class:'pin-over-title',text:'PARTIDA FINALIZADA'}));
box.appendChild(Util.el('div',{class:'pin-over-score',text:Math.floor(score)+' puntos'}));
if(score>=50){
var btn=Util.el('button',{class:'xp-btn primary',text:'Cobrar premio: '+Util.fmtMoney(cash)});
btn.addEventListener('click',function(){
NS.State.addCash(cash);
S.games.pinballCash+=cash;
NS.Audio.cash();
NS.UI.toast('NovaPinball','Premio cobrado: '+Util.fmtMoney(cash)+'. ¡Bien jugado!','good','ic-pinball');
box.classList.add('hidden');
newGame();
});
box.appendChild(btn);
}
var again=Util.el('button',{class:'xp-btn',text:'Jugar otra vez'});
again.addEventListener('click',function(){
box.classList.add('hidden');
newGame();
});
box.appendChild(again);
if(Math.floor(score)>S.games.pinball)S.games.pinball=Math.floor(score);
}
}
function loop(ts){
if(!running)return;
var dt=Math.min(0.033,(ts-lastTime)/1000||0.016);
lastTime=ts;

step(dt/2);
step(dt/2);
draw();
raf=requestAnimationFrame(loop);
}
function startGame(){
if(running)return;
running=true;
lastTime=performance.now();
raf=requestAnimationFrame(loop);
}
function render(body){
body.innerHTML='';
body.className='app-pad pin-root';
var wrap=Util.el('div',{style:{display:'flex',gap:'12px',alignItems:'flex-start'}});
cv=Util.el('canvas',{width:W,height:H,style:{border:'2px solid #1c3f6e',borderRadius:'4px'}});
ctx=cv.getContext('2d');
wrap.appendChild(cv);
var side=Util.el('div',{style:{flex:'1',minWidth:'150px'}});
var p1=Util.el('div',{class:'panel'});
p1.appendChild(Util.el('div',{class:'panel-title',text:'Controles'}));
p1.appendChild(Util.el('div',{class:'cfg-sub',text:'← → / A D: flippers · ESPACIO (mantener): cargar y lanzar.'}));
var flRow=Util.el('div',{class:'trade-row'});
var bL=Util.el('button',{class:'xp-btn',text:'◀ FLIP'});
var bR=Util.el('button',{class:'xp-btn',text:'FLIP ▶'});
bL.addEventListener('mousedown',function(){flipperL=true;});
bL.addEventListener('mouseup',function(){flipperL=false;});
bL.addEventListener('mouseleave',function(){flipperL=false;});
bR.addEventListener('mousedown',function(){flipperR=true;});
bR.addEventListener('mouseup',function(){flipperR=false;});
bR.addEventListener('mouseleave',function(){flipperR=false;});
flRow.appendChild(bL);flRow.appendChild(bR);
p1.appendChild(flRow);
var launch=Util.el('button',{class:'xp-btn primary',text:'Lanzar (ESPACIO)'});
launch.addEventListener('mousedown',function(){chargeLaunch();});
launch.addEventListener('mouseup',function(){releaseLaunch();});
p1.appendChild(launch);
side.appendChild(p1);
var p2=Util.el('div',{class:'panel'});
p2.appendChild(Util.el('div',{class:'panel-title',text:'Premio'}));
p2.appendChild(Util.el('div',{class:'cfg-sub',id:'pin-best',text:'Récord: '+(NS.State.get().games.pinball||0)+' puntos'}));
p2.appendChild(Util.el('div',{class:'cfg-sub',text:'Cada 50 puntos = 1 $ al terminar. Bumpers +25, flippers +10.'}));
side.appendChild(p2);
var overlay=Util.el('div',{class:'pin-overlay hidden',id:'pinball-overlay'});
wrap.appendChild(side);
body.appendChild(wrap);
body.appendChild(overlay);
newGame();
startGame();
document.addEventListener('keydown',onKeyDown);
document.addEventListener('keyup',onKeyUp);
}
function tick(){
var best=Util.$('#pin-best');
if(best)best.textContent='Récord: '+(NS.State.get().games.pinball||0)+' puntos';
}
NS.Apps.register({
id:'pinball',title:'NovaPinball',icon:'ic-pinball',
desktop:true,w:600,h:600,minW:520,minH:500,
render:render,tick:tick,
onClose:function(){
running=false;
if(raf)cancelAnimationFrame(raf);
document.removeEventListener('keydown',onKeyDown);
document.removeEventListener('keyup',onKeyUp);

if(score>0&&!gameOver){
var cash=Math.floor(score/50);
if(cash>0){
NS.State.addCash(cash);
S.games.pinballCash+=cash;
NS.UI.toast('NovaPinball','Premio cobrado al cerrar: '+Util.fmtMoney(cash)+'.','good','ic-pinball');

}
});
})();
</script>

var raf=null;
var running=false;
var lastTime=0;
var T={x0:30,y0:30,x1:610,y1:330};
var BALL_R=11;
var POCKETS=[
{x:30,y:30},{x:320,y:27},{x:610,y:30},
{x:30,y:330},{x:320,y:333},{x:610,y:330}
];
var POCKET_R=17;
var balls=[];
var cue=null;
var turn='player';
var groupPlayer=null;
var groupCpu=null;
var phase='aim';
var again=false;
var aim={x:200,y:180};
var lastHitAt=0;
var result=null;
var COLORS={
solid:['#f2c14e','#3a5fd0','#c03030','#7a3aa0','#e0752a','#2c7a3e','#8a3a2a','#1a1f2e'],
stripe:['#f2c14e','#3a5fd0','#c03030','#7a3aa0','#e0752a','#2c7a3e','#8a3a2a','#1a1f2e']
};
function makeBalls(){
balls=[];
cue={x:140,y:H/2,vx:0,vy:0,r:BALL_R,m:121,num:0,type:'cue',pocketed:false};
balls.push(cue);
var apexX=470,apexY=H/2;
var n=1;
for(var row=0;row<5;row++){
for(var col=0;col<=row;col++){
var type=n===8?'8':(n<=7?'solid':'stripe');
balls.push({
x:apexX+row*(BALL_R*2+1),
y:apexY+(col-row/2)*(BALL_R*2+1),
vx:0,vy:0,r:BALL_R,m:121,
num:n,type:type,pocketed:false
});
n++;
}
}
}
function newGame(){
makeBalls();
turn='player';groupPlayer=null;groupCpu=null;
phase='aim';again=false;result=null;
var st=Util.$('#pool-status');
if(st)st.textContent='Tu turno — Tiras. Rompe el triángulo.';
}
function groupLabel(g){return g==='solid'?'sólidas':'listadas';}
function onPocketed(ball){
ball.pocketed=true;
NS.Audio.popup();
if(ball.type==='cue'){
cue.x=140;cue.y=H/2;cue.vx=0;cue.vy=0;cue.pocketed=false;
turn=turn==='player'?'cpu':'player';
again=false;
setStatus('¡Metediste la blanca! Turno del rival.');
return;
}
if(ball.num===8){

if(!groupPlayer){
ball.pocketed=false;
ball.x=320;ball.y=H/2;ball.vx=0;ball.vy=0;
turn=turn==='player'?'cpu':'player';
again=false;
NS.UI.toast('NovaPool','¡La 8 entró en la rotura! Se recoloca y sigue la partida.','important','ic-pool');
return;
}
var mine=turn==='player'?groupPlayer:groupCpu;
var cleared=balls.filter(function(b){return b.type===mine&&!b.pocketed;}).length===0;
if(cleared){
result=turn;
NS.Audio.startup();
if(turn==='player'){
var S=NS.State.get();
NS.State.addCash(25);
S.games.poolWins++;
NS.UI.toast('NovaPool','¡GANASTE! +'+Util.fmtMoney(25)+' por la partida.','good','ic-pool');
}else{
NS.UI.toast('NovaPool','La CPU te ganó. ¡Revancha!','important','ic-pool');
}
phase='over';
}else{
result=turn==='player'?'cpu':'player';
NS.Audio.error();
NS.UI.toast('NovaPool','Metediste la 8 antes de tiempo. Pierdes.','important','ic-pool');
phase='over';
}
return;
}

if(!groupPlayer){
groupPlayer=turn==='player'?ball.type:(ball.type==='solid'?'stripe':'solid');
groupCpu=groupPlayer==='solid'?'stripe':'solid';
setStatus(turn==='player'
?'Tiras '+groupLabel(groupPlayer)+' — ¡sigue si metes de las tuyas!'
:'La CPU tira '+groupLabel(groupCpu)+' — tú tiras '+groupLabel(groupPlayer)+'.');
}
var mineType=turn==='player'?groupPlayer:groupCpu;
again=ball.type===mineType;
if(!again)setStatus('Fallaste en las tuyas. Turno del rival.');
else setStatus('¡Bien! Otra vez tú.');
}
function setStatus(t){
var st=Util.$('#pool-status');
if(st)st.textContent=t;
}
function endMove(){
if(phase==='over')return;
if(again){
again=false;
phase=turn==='player'?'aim':'cpu';
setStatus(turn==='player'?'Tu turno — otra vez.':'Turno de la CPU...');
}else{
turn=turn==='player'?'cpu':'player';
phase=turn==='player'?'aim':'cpu';
setStatus(turn==='player'?'Tu turno.':'Turno de la CPU...');
}
if(phase==='cpu')scheduleCpu();
}
function allStill(){
for(var i=0;i<balls.length;i++){
if(!balls[i].pocketed&&(Math.abs(balls[i].vx)>0.5||Math.abs(balls[i].vy)>0.5))return false;
}
return true;
}
var dragActive=false;
var dragPower=0;
function shootTo(mx,my){
if(phase!=='aim'||cue.pocketed||result)return;
var dx=mx-cue.x,dy=my-cue.y;
var d=Math.sqrt(dx*dx+dy*dy);
if(d<8)return;
var nx=dx/d,ny=dy/d;
var power=Util.clamp(d/280,0.1,1);
cue.vx=nx*(400+power*900);
cue.vy=ny*(400+power*900);
phase='move';
lastHitAt=performance.now();
NS.Audio.hack();
}
function scheduleCpu(){
setTimeout(function(){
if(!running||phase!=='cpu')return;
var shot=cpuPick();
if(!shot){setStatus('La CPU no tiene tiro claro...');endMove();return;}
cue.vx=shot.dx*shot.power;
cue.vy=shot.dy*shot.power;
phase='move';
NS.Audio.hack();
},1100);
}
function cpuPick(){
var mine=balls.filter(function(b){return!b.pocketed&&b.type===groupCpu;});
if(!mine.length)mine=balls.filter(function(b){return!b.pocketed&&b.num===8;});
var best=null;
mine.forEach(function(target){
POCKETS.forEach(function(p){

var dx=p.x-target.x,dy=p.y-target.y;
var d=Math.sqrt(dx*dx+dy*dy);
if(d<1)return;
var nx=dx/d,ny=dy/d;

var blocked=balls.some(function(o){
if(o===target||o.pocketed||o.type==='cue')return false;
var px=o.x-target.x,py=o.y-target.y;
var proj=px*nx+py*ny;
if(proj<-2||proj>d+2)return false;
var perp=Math.abs(px*ny-py*nx);
return perp<BALL_R*2;
});
if(blocked)return;

var qx=target.x-cue.x,qy=target.y-cue.y;
var qd=Math.sqrt(qx*qx+qy*qy)||1;
var qnx=qx/qd,qny=qy/qd;
var qblocked=balls.some(function(o){
if(o===cue||o===target||o.pocketed)return false;
var px=o.x-cue.x,py=o.y-cue.y;
var proj=px*qnx+py*qny;
if(proj<-2||proj>qd+2)return false;
var perp=Math.abs(px*qny-py*qnx);
return perp<BALL_R*2;
});
var align=1-Util.clamp(d/700,0,1);
var score=align*(qblocked?0.1:1);
if(!best||score>best.score){
best={dx:qnx,dy:qny,power:Util.clamp(qd/260,0.3,0.95),score:score};
}
});
});
return best;
}
function step(dt){
if(phase!=='move')return;
NS.Physics.stepBalls(balls,dt);
var fr=Math.pow(0.985,dt*60);
for(var i=0;i<balls.length;i++){
var b=balls[i];
if(b.pocketed)continue;
b.vx*=fr;b.vy*=fr;
if(Math.abs(b.vx)<0.03)b.vx=0;
if(Math.abs(b.vy)<0.03)b.vy=0;
NS.Physics.wallBounce(b,T.x0,T.y0,T.x1,T.y1);
for(var p=0;p<POCKETS.length;p++){
if(NS.Physics.pocketed(b,POCKETS[p].x,POCKETS[p].y,POCKET_R)){
onPocketed(b);
break;
}
}
}
if(phase==='move'&&allStill())endMove();
}
function draw(){
if(!ctx)return;

ctx.fillStyle='#123a1e';
ctx.fillRect(0,0,W,H);
ctx.fillStyle='#2c7a3e';
ctx.fillRect(T.x0-4,T.y0-4,T.x1-T.x0+8,T.y1-T.y0+8);
ctx.strokeStyle='#0f2a14';
ctx.lineWidth=4;
ctx.strokeRect(T.x0,T.y0,T.x1-T.x0,T.y1-T.y0);

ctx.strokeStyle='rgba(255,255,255,.25)';
ctx.lineWidth=1;
ctx.beginPath();
ctx.moveTo(215,T.y0);ctx.lineTo(215,T.y1);
ctx.stroke();

POCKETS.forEach(function(p){
ctx.beginPath();
ctx.arc(p.x,p.y,POCKET_R,0,Math.PI*2);
ctx.fillStyle='#0a0a12';
ctx.fill();
ctx.strokeStyle='#2a2f3d';
ctx.stroke();
});

balls.forEach(function(b){
if(b.pocketed)return;
var c='#fff';
if(b.type==='solid')c=COLORS.solid[b.num];
else if(b.type==='stripe')c='#f8f8f8';
else if(b.type==='8')c='#1a1f2e';
ctx.beginPath();
ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
ctx.fillStyle=c;
ctx.fill();
ctx.strokeStyle='#333';
ctx.lineWidth=1;
ctx.stroke();
if(b.type==='stripe'){
ctx.fillStyle=COLORS.stripe[b.num];
ctx.fillRect(b.x-b.r,b.y-4,b.r*2,8);
ctx.beginPath();
ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
ctx.fillStyle='rgba(0,0,0,0)';
ctx.strokeStyle='#333';
ctx.stroke();
}
if(b.num>0){
ctx.fillStyle='#fff';
ctx.font='bold 8px Tahoma';
ctx.textAlign='center';
ctx.textBaseline='middle';
ctx.fillText(String(b.num),b.x,b.y+0.5);
}
});

if(phase==='aim'&&!cue.pocketed){
var dx=aim.x-cue.x,dy=aim.y-cue.y;
var d=Math.sqrt(dx*dx+dy*dy)||1;
var nx=dx/d,ny=dy/d;
ctx.setLineDash([6,6]);
ctx.strokeStyle='rgba(255,255,255,.7)';
ctx.lineWidth=1.5;
ctx.beginPath();
ctx.moveTo(cue.x,cue.y);
ctx.lineTo(cue.x+nx*260,cue.y+ny*260);
ctx.stroke();
ctx.setLineDash([]);

if(dragActive){
var power=Util.clamp(d/280,0.1,1);
ctx.fillStyle='#0a0a12';
ctx.fillRect(8,H-22,120,10);
ctx.fillStyle=power>0.75?'#ff6b6b':power>0.4?'#f2c14e':'#7ed957';
ctx.fillRect(9,H-21,118*power,8);
ctx.strokeStyle='#fff';
ctx.strokeRect(8,H-22,120,10);
ctx.fillStyle='#fff';
ctx.font='10px Tahoma';
ctx.fillText('POTENCIA '+Math.round(power*100)+' %',8,H-28);
}
}

ctx.fillStyle='#fff';
ctx.font='bold 12px Tahoma';
ctx.textAlign='left';
ctx.textBaseline='alphabetic';
var gTxt='Tú: '+(groupPlayer?groupLabel(groupPlayer):'—')+'   CPU: '+(groupCpu?groupLabel(groupCpu):'—');
ctx.fillText(gTxt,8,16);
ctx.font='10px Tahoma';
ctx.fillText('Ganar = +25 $ · Mete la 8 al final',8,H-6);
}
function loop(ts){
if(!running)return;
var dt=Math.min(0.033,(ts-lastTime)/1000||0.016);
lastTime=ts;

step(dt/2);
step(dt/2);
draw();
raf=requestAnimationFrame(loop);
}
function start(){
if(running)return;
running=true;
lastTime=performance.now();
raf=requestAnimationFrame(loop);
}
function onMove(e){
var r=cv.getBoundingClientRect();
aim.x=Util.clamp(e.clientX-r.left,T.x0,T.x1);
aim.y=Util.clamp(e.clientY-r.top,T.y0,T.y1);
}
function onDown(e){
if(phase!=='aim')return;
dragActive=true;
}
function onUp(e){
if(!dragActive)return;
dragActive=false;
var r=cv.getBoundingClientRect();
shootTo(e.clientX-r.left,e.clientY-r.top);
}
function render(body){
body.innerHTML='';
body.className='app-pad';
var wrap=Util.el('div',{style:{display:'flex',gap:'12px',alignItems:'flex-start'}});
cv=Util.el('canvas',{width:W,height:H,style:{border:'2px solid #0f2a14',borderRadius:'6px',cursor:'crosshair'}});
ctx=cv.getContext('2d');
cv.addEventListener('mousemove',onMove);
cv.addEventListener('mousedown',onDown);

window.addEventListener('mouseup',onUp);
wrap.appendChild(cv);
var side=Util.el('div',{style:{flex:'1',minWidth:'170px'}});
var p1=Util.el('div',{class:'panel'});
p1.appendChild(Util.el('div',{class:'panel-title',text:'Partida'}));
p1.appendChild(Util.el('div',{class:'cfg-sub',id:'pool-status',text:'Tu turno — Rompe el triángulo.'}));
p1.appendChild(Util.el('div',{class:'cfg-sub',text:'Arrastra con el ratón para apuntar: la distancia controla la fuerza. Mete tus bolas y la 8 al final. La CPU tira listadas.'}));
var restart=Util.el('button',{class:'xp-btn',text:'Nueva partida'});
restart.addEventListener('click',function(){newGame();});
p1.appendChild(restart);
var p2=Util.el('div',{class:'panel'});
p2.appendChild(Util.el('div',{class:'panel-title',text:'Historial'}));
p2.appendChild(Util.el('div',{class:'cfg-sub',id:'pool-stats',text:''}));
side.appendChild(p1);
side.appendChild(p2);
wrap.appendChild(side);
body.appendChild(wrap);
newGame();
start();
}
function tick(){
var st=Util.$('#pool-stats');
if(st){
var S=NS.State.get();
st.textContent='Victorias: '+(S.games.poolWins||0)+' · Ganadas cobradas: '+Util.fmtMoney((S.games.poolWins||0)*25);
}
}
NS.Apps.register({
id:'pool',title:'NovaPool 8-Ball',icon:'ic-pool',
desktop:true,w:860,h:440,minW:700,minH:380,
render:render,tick:tick,
onClose:function(){
running=false;
if(raf)cancelAnimationFrame(raf);
window.removeEventListener('mouseup',onUp);
}
});
})();
</script>

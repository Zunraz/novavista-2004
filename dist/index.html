<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var NPCS=[
{name:'Búfer',avatar:6,power:3200,elo:1150},
{name:'Cafeína_2004',avatar:9,power:9800,elo:1310},
{name:'Ruter69',avatar:8,power:26000,elo:1420},
{name:'Sector9',avatar:10,power:74000,elo:1580},
{name:'N0va_Fan',avatar:12,power:190000,elo:1720},
{name:'Chip_Chandler',avatar:7,power:480000,elo:1890},
{name:'DatoNegro',avatar:11,power:1250000,elo:2050},
{name:'Ph4ntom',avatar:14,power:3300000,elo:2240},
{name:'La_Sombra',avatar:13,power:8700000,elo:2410},
{name:'ZeroCool_ES',avatar:15,power:22000000,elo:2590},
{name:'MasterServidor',avatar:0,power:59000000,elo:2750},
{name:'NullPointer',avatar:10,power:150000000,elo:2900}
];
function implantLevels(st){
var n=0;
Object.keys(st.upg||{}).forEach(function(k){
if(k.indexOf('i-')===0)n+=st.upg[k];
});
return n;
}
function powerOf(st){
var c=st.currencies;
var wealth=c.cash+st.bank.balance;
return Math.floor(
wealth+
st.social.followers*10+
st.bots.count*1500+
c.novaCoins*40+
c.level*300+
c.legacy*8000+
implantLevels(st)*200+
(st.meta.bossesDrained||0)*500
);
}
function eloOf(st){
var e=1000+
(st.meta.bossesDrained||0)*150+
(st.meta.nodesDrained||0)*8+
(st.meta.runsDone||0)*25-
(st.meta.runsTraced||0)*30+
st.currencies.level*20;
return Math.max(400,e);
}
function gather(){
var rows=[];
var myId=NS.Save.currentProfileId();
var myIdRestore=myId;

var profs=NS.Save.listProfiles();
try{
profs.forEach(function(p){
if(p.id===myIdRestore)return;
var saved=null;
if(NS.Save.setProfile(p.id)){
var res=NS.Save.load();
if(res.ok)saved=res.state;
}
if(saved){
rows.push({
name:saved.profile.name,avatar:saved.profile.avatar,
power:powerOf(saved),elo:eloOf(saved),isPlayer:false,level:saved.currencies.level
});
}
});
}finally{

if(myIdRestore)NS.Save.setProfile(myIdRestore);
}

var S=NS.State.get();
rows.push({
name:S.profile.name,avatar:S.profile.avatar,
power:powerOf(S),elo:eloOf(S),isPlayer:true,level:S.currencies.level
});

NPCS.forEach(function(n){
rows.push({name:n.name,avatar:n.avatar,power:n.power,elo:n.elo,isPlayer:false,level:1+Math.floor(Math.log(n.power)/Math.LN10)});
});

if(myId)NS.Save.setProfile(myId);
return rows;
}
function rankRow(row,pos,scoreTxt,top){
var r=Util.el('div',{class:'rank-row'+(row.isPlayer?' me':'')});
var posEl=Util.el('span',{class:'rank-pos'+(top?' rank-top'+top:''),text:pos+'º'});
r.appendChild(posEl);
r.appendChild(Util.svgIcon(NS.Catalog.AVATARS[(row.avatar||0)%NS.Catalog.AVATARS.length],'icon icon-24'));
var info=Util.el('div',{style:{flex:'1'}});
info.appendChild(Util.el('div',{class:'mail-subj',text:row.name+(row.isPlayer?'  ← TÚ':'')}));
info.appendChild(Util.el('div',{class:'cfg-sub',text:'Nivel '+(row.level||1)}));
r.appendChild(info);
r.appendChild(Util.el('span',{class:'rank-score',text:scoreTxt}));
return r;
}
function sortBy(arr,key){
return arr.slice().sort(function(a,b){return b[key]-a[key];});
}
function render(body){
body.innerHTML='';
body.className='app-pad';
var tabs=Util.el('div',{class:'tabs'});
var content=Util.el('div',{class:'tab-content'});
function table(title,key,fmt){
content.innerHTML='';
var rows=sortBy(gather(),key);
var myRow=rows.filter(function(r){return r.isPlayer;})[0];
var myPos=rows.indexOf(myRow)+1;
var head=Util.el('div',{class:'panel'});
head.appendChild(Util.el('div',{class:'panel-title',text:title}));
head.appendChild(Util.el('div',{class:'cfg-info',html:
'Tu puesto: <b>#'+myPos+' de '+rows.length+'</b> ('+(fmt(myRow[key]))+')'
}));
content.appendChild(head);
var list=Util.el('div',{class:'panel'});
rows.forEach(function(row,i){
list.appendChild(rankRow(row,i+1,fmt(row[key]),i<3?i+1:0));
});
content.appendChild(list);
}
var b1=Util.el('button',{class:'tab-btn',text:'Más poder'});
b1.addEventListener('click',function(){
Util.$$('.tab-btn',tabs).forEach(function(x){x.classList.remove('on');});
b1.classList.add('on');
table('Ranking de PODER','power',function(v){return Util.fmtNum(v)+' PT';});
});
var b2=Util.el('button',{class:'tab-btn',text:'Mayor hacker (ELO)'});
b2.addEventListener('click',function(){
Util.$$('.tab-btn',tabs).forEach(function(x){x.classList.remove('on');});
b2.classList.add('on');
table('Ranking de ELO HACKER','elo',function(v){return Util.fmtInt(v)+' ELO';});
});
tabs.appendChild(b1);
tabs.appendChild(b2);
body.appendChild(tabs);
body.appendChild(content);
b1.click();
}
NS.Apps.register({
id:'ranking',title:'Rankings NovaVista',icon:'ic-trophy',
desktop:true,w:480,h:520,minW:420,minH:400,
render:render
});
NS.Ranking={powerOf:powerOf,eloOf:eloOf};
})();
</script>
<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var currentDoc=null;
function docs(){
var S=NS.State.get();
if(!S.docs)S.docs=[];
return S.docs;
}
function render(body){
body.innerHTML='';
body.className='app-pad';
var cols=Util.el('div',{class:'files-cols'});
var left=Util.el('div',{class:'files-col',style:{flex:'0 0 170px'}});
var p1=Util.el('div',{class:'panel'});
p1.appendChild(Util.el('div',{class:'panel-title',text:'Documentos'}));
var d=docs();
if(!d.length)p1.appendChild(Util.el('div',{class:'cfg-sub',text:'Sin documentos. Crea uno nuevo.'}));
d.forEach(function(doc){
var r=Util.el('div',{class:'mail-row clickable'+(currentDoc===doc?' mail-done':'')});
r.appendChild(Util.svgIcon('ic-doc'));
var info=Util.el('div',{style:{flex:'1'}});

r.addEventListener('click',function(){
currentDoc=doc;
NS.WM.rerender('notepad');
var ta=Util.$('#notepad-ta');
if(ta)ta.value=doc.text;
});
var del=Util.el('button',{class:'xp-btn small danger',text:'✕'});
del.addEventListener('click',function(e){
e.stopPropagation();
d.splice(d.indexOf(doc),1);
if(currentDoc===doc)currentDoc=null;
NS.WM.rerender('notepad');
});
r.appendChild(del);
p1.appendChild(r);
});
var nuevo=Util.el('button',{class:'xp-btn small',text:'+ Nuevo documento'});
nuevo.addEventListener('click',function(){
var doc={title:'Sin título '+(d.length+1),text:'',at:Date.now()};
d.push(doc);
currentDoc=doc;
NS.WM.rerender('notepad');
});
p1.appendChild(nuevo);
left.appendChild(p1);
cols.appendChild(left);
var right=Util.el('div',{class:'files-col'});
if(!currentDoc){
right.appendChild(Util.el('div',{class:'cfg-info',text:'Selecciona o crea un documento para empezar a escribir.'}));
}else{
var p2=Util.el('div',{class:'panel'});
var titlerow=Util.el('div',{class:'trade-row'});
var title=Util.el('input',{class:'xp-input',id:'notepad-title',value:currentDoc.title,maxlength:'40',style:{flex:'1'}});
titlerow.appendChild(title);
var saveBtn=Util.el('button',{class:'xp-btn primary small',text:'Guardar'});
saveBtn.addEventListener('click',function(){
currentDoc.title=title.value.trim().slice(0,40)||'Sin título';
currentDoc.text=Util.$('#notepad-ta').value;
currentDoc.at=Date.now();
NS.State.saveNow();
NS.Audio.cash();
NS.UI.toast('Bloc de notas','Documento guardado en tu cuenta.','good','ic-notepad');
NS.WM.rerender('notepad');
});
titlerow.appendChild(saveBtn);
p2.appendChild(titlerow);
var ta=Util.el('textarea',{class:'xp-input notepad-ta',id:'notepad-ta',placeholder:'Escribe aquí...'});
ta.value=currentDoc.text;
p2.appendChild(ta);
var infoLine=Util.el('div',{class:'cfg-sub',id:'notepad-info',text:''});
ta.addEventListener('input',function(){
infoLine.textContent=Util.fmtInt(ta.value.length)+' caracteres · '+(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+' palabras';
});
p2.appendChild(infoLine);
right.appendChild(p2);
}
cols.appendChild(right);
body.appendChild(cols);
}
NS.Apps.register({
id:'notepad',title:'Bloc de notas',icon:'ic-notepad',
desktop:true,w:560,h:440,minW:440,minH:340,
render:render
});
})();
</script>
<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var acc=0;
var op=null;
var display='0';
var fresh=true;
function renderDisplay(){
var el=Util.$('#calc-display');
if(el)el.textContent=display;
}
function pushDigit(d){
if(fresh){display=d;fresh=false;}
else{
if(display.replace('-','').length>=15)return;
display=display==='0'?d:display+d;
}
renderDisplay();
}
function pushDot(){
if(fresh){display='0.';fresh=false;}
else if(display.indexOf('.')===-1)display+='.';
renderDisplay();
}
function setOp(nextOp){
if(op&&!fresh)compute();
else if(op&&fresh){op=nextOp;renderDisplay();return;}
acc=parseFloat(display)||0;
op=nextOp;
fresh=true;
renderDisplay();
}
function compute(){
if(op===null)return;
var b=parseFloat(display)||0;
var r;
switch(op){
case'+':r=acc+b;break;
case'-':r=acc-b;break;
case'×':r=acc*b;break;
case'÷':r=b===0?NaN:acc/b;break;
default:r=b;
}
if(!isFinite(r)){display='Error';op=null;acc=0;fresh=true;renderDisplay();return;}
display=String(Math.round(r*1e10)/1e10);
acc=r;
op=null;
fresh=true;
renderDisplay();
}
function equals(){compute();}
function clearAll(){acc=0;op=null;display='0';fresh=true;renderDisplay();}
function back(){
if(fresh)return;
display=display.length>1?display.slice(0,-1):'0';
renderDisplay();
}
function neg(){
if(display==='Error')return;
display=display.charAt(0)==='-'?display.slice(1):(display==='0'?'0':'-'+display);
renderDisplay();
}
function pct(){
if(display==='Error')return;
display=String((parseFloat(display)||0)/100);
renderDisplay();
}
function key(label,fn,cls){
var b=Util.el('button',{class:'calc-key '+(cls||''),text:label});
b.addEventListener('click',function(){fn();NS.Audio.tick();});
return b;
}
function render(body){
body.innerHTML='';
body.className='app-pad';
var wrap=Util.el('div',{style:{maxWidth:'300px',margin:'0 auto'}});
var disp=Util.el('div',{class:'calc-display',id:'calc-display',text:display});
wrap.appendChild(disp);
var grid=Util.el('div',{class:'calc-grid'});
[['C',clearAll,'calc-fn'],['±',neg,'calc-fn'],['%',pct,'calc-fn'],['÷',function(){setOp('÷');},'calc-op'],
['7',function(){pushDigit('7');}],['8',function(){pushDigit('8');}],['9',function(){pushDigit('9');}],['×',function(){setOp('×');},'calc-op'],
['4',function(){pushDigit('4');}],['5',function(){pushDigit('5');}],['6',function(){pushDigit('6');}],['-',function(){setOp('-');},'calc-op'],
['1',function(){pushDigit('1');}],['2',function(){pushDigit('2');}],['3',function(){pushDigit('3');}],['+',function(){setOp('+');},'calc-op'],
['←',back,'calc-fn'],['0',function(){pushDigit('0');}],[',',pushDot],['=',equals,'calc-eq']].forEach(function(k){
grid.appendChild(key(k[0],k[1],k[2]));
});
wrap.appendChild(grid);
body.appendChild(wrap);

document.addEventListener('keydown',onKey);
}
function onKey(e){
if(!NS.WM.isOpen('calc'))return;
var k=e.key;
if(/^[0-9]$/.test(k))pushDigit(k);
else if(k==='.')pushDot();
else if(k==='+')setOp('+');
else if(k==='-')setOp('-');
else if(k==='*'||k.toLowerCase()==='x')setOp('×');
else if(k==='/'){e.preventDefault();setOp('÷');}
else if(k==='Enter'||k==='=')equals();
else if(k==='Backspace')back();
else if(k==='Escape')clearAll();
}
NS.Apps.register({
id:'calc',title:'Calculadora',icon:'ic-calc',
desktop:true,w:340,h:440,minW:300,minH:380,
render:render,
onClose:function(){document.removeEventListener('keydown',onKey);}
});
})();
</script>
<script>(function(){
'use strict';
var NS=window.NovaOS=window.NovaOS||{};
var Util=NS.Util;
var started=false;
var desktopStarted=false;
var prev=0;
var trayTick=0;
function init(){
if(started)return;
started=true;


try{
var xlinkNS='http://www.w3.org/1999/xlink';
var fixUse=function(root){
var uses=root.querySelectorAll?root.querySelectorAll('use'):[];
for(var i=0;i<uses.length;i++){
var u=uses[i];
var h=u.getAttribute('href');
if(h&&!u.getAttributeNS(xlinkNS,'href'))u.setAttributeNS(xlinkNS,'xlink:href',h);
}
};
fixUse(document);
new MutationObserver(function(muts){
for(var m=0;m<muts.length;m++){
for(var k=0;k<muts[m].addedNodes.length;k++){
var n=muts[m].addedNodes[k];
if(n&&n.nodeType===1)fixUse(n);
}
}
}).observe(document.body,{childList:true,subtree:true});
}catch(e){}

var konami=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
var konamiIdx=0;
var konamiUsed=false;
document.addEventListener('keydown',function(e){
var key=e.key;
if((e.ctrlKey&&e.altKey&&key==='Delete')||(e.ctrlKey&&e.shiftKey&&key==='Escape')){
e.preventDefault();
if(NS.TaskMgr&&NS.TaskMgr.open)NS.TaskMgr.open();
return;
}
if(key===konami[konamiIdx]){
konamiIdx++;
if(konamiIdx===konami.length){
konamiIdx=0;
if(!konamiUsed){
konamiUsed=true;
NS.State.addCash(50);
NS.UI.toast('Código Konami','¡Truco activado! +'+Util.fmtMoney(50)+' (una vez por sesión).','good','ic-egg');
NS.Audio.startup();
}else{
NS.UI.toast('Código Konami','Ya usaste el truco esta sesión.','dim','ic-egg');
}
}
}else if(key.indexOf('Arrow')===0||key==='b'||key==='a'){
konamiIdx=key===konami[0]?1:0;
}
});
NS.Taskbar.init();
NS.Event.init();

NS.Desktop.buildIcons();

NS.Boot.run();
}
function enterDesktop(){
if(desktopStarted)return;
desktopStarted=true;
var res=NS.State.loadGame();
var S=NS.State.get();
S.meta.bootCount++;

NS.Desktop.refresh();
NS.Audio.setEnabled(S.settings.sound);
NS.Taskbar.buildStartMenu();
NS.Taskbar.refreshTray();

NS.Taskbar.tickClock();
NS.Taskbar.updateMoney();
setInterval(function(){
NS.Taskbar.tickClock();
NS.Taskbar.updateMoney();
},1000);

if(res.restored){
NS.UI.toast('Integridad del guardado','El guardado principal estaba modificado o corrupto. Se restauró la última copia de seguridad válida.','important','ic-warning');
}
if(res.quarantined){
NS.UI.toast('¡CUARENTENA!','Se detectó un guardado manipulado y no había copia válida. El sistema se reinició en modo seguro: no se guardará progreso hasta restaurar en NovaShield.','important','ic-error');
}

if(S.meta.bootCount<=1){
NS.UI.dialog({
title:'Bienvenido a NovaVista 2004',
icon:'ic-hacker',
message:'Este sistema operativo simulado esconde un <b>juego incremental con rasgos roguelite</b>.<br><br>'+
'Gana dinero con el banco y MyNova, roba datos en los asaltos de red, mina NovaCoins y acumula <b>legado</b> formateando el sistema.<br><br>'+
'Abre el <b>Manual de NovaVista</b> del escritorio para empezar con buen pie. ¡Bienvenido, '+Util.esc(S.profile.name)+'!',
buttons:[{label:'¡A jugar!',value:true,primary:true}]
});
}

var now=Date.now();
var delta=now-(S.meta.lastSeen||now);
if(delta>60000&&!NS.Sec.isQuarantined()){
NS.State.offline(delta);
}

prev=Date.now();
setInterval(loop,200);

setInterval(function(){NS.State.saveNow();},15000);
document.addEventListener('visibilitychange',function(){
if(document.visibilityState==='hidden')NS.State.saveNow();
});
window.addEventListener('beforeunload',function(){NS.State.saveNow();});
window.addEventListener('pagehide',function(){NS.State.saveNow();});

Util.$('#desktop').addEventListener('contextmenu',function(e){
if(e.target.closest('.window'))return;
NS.Desktop.onContext(e);
});
}
function loop(){
var now=Date.now();
var dt=now-prev;
prev=now;
try{
NS.Sec.periodicChecks();
NS.State.tick(dt);
NS.WM.tickAll();
trayTick++;
if(trayTick%10===0){
NS.Taskbar.refreshTray();
NS.State.verify();
if(NS.Mail&&NS.Mail.refreshBadge)NS.Mail.refreshBadge();
}
}catch(e){

if(window.console&&console.error)console.error('[NovaVista]',e);
}
}
NS.Main={init:init,enterDesktop:enterDesktop,afterBoot:enterDesktop};
if(document.readyState==='loading'){
document.addEventListener('DOMContentLoaded',init);
}else{
init();
}
})();
</script>
</body>
